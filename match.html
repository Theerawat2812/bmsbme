  // ==================================

  var MAX_RESULTS = 10;
  // what each expertise group also answers to when someone types a search
  var FIELD_SYNONYMS = {
    "Immunology & Vaccines": "immunology immune immunity vaccine vaccination infectious disease t cell antibody",
    "Cancer Biology": "cancer oncology tumor carcinoma chemotherapy anticancer",
    "Biomarkers & Diagnostics": "biomarker diagnosis diagnostic detection screening proteomics",
    "Microbiology & Antimicrobial Resistance": "microbiology bacteria bacterial antibiotic resistance amr phage probiotic infection",
    "Genomics & Bioinformatics": "genomics genome bioinformatics computational sequencing docking",
    "Natural Products & Drug Discovery": "natural product herbal plant extract drug pharmacology medicinal chemistry",
    "Neuroscience & Neurology": "neuroscience neurology brain eeg epilepsy dementia",
    "Biomaterials & Tissue Engineering": "biomaterial tissue engineering scaffold bone stem cell regenerative",
    "Biosensors & Medical Devices": "biosensor sensor device electrochemical microfluidic",
    "AI & Medical Informatics": "ai artificial intelligence machine learning deep learning informatics data",
    "Biomechanics & Rehabilitation": "biomechanics rehabilitation orthopedic gait finite element",
    "Cardiovascular & Hemodynamics": "cardiovascular blood flow hemodynamics heart vascular"
  };
  // short forms people commonly type -> terms that appear in the advisors' data
  var ALIASES = {
    "ai": ["artificial intelligence", "machine learning", "deep learning"],
    "ml": ["machine learning"],
    "tb": ["tuberculosis"],
    "covid": ["covid-19", "sars-cov-2"],
    "amr": ["antimicrobial resistance"],
    "eeg": ["eeg"],
    "bme": ["biomedical engineering"]
  };
  var input = document.getElementById("mField");
  var btn = document.getElementById("mBtn");
  var overlay = document.getElementById("mOverlay");
  var closeBtn = document.getElementById("mClose");
  var head = document.getElementById("mHead");
  var out = document.getElementById("mResult");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined) { e.textContent = text; }
    return e;
  }

  function openPop() { overlay.className = "m-overlay open"; }
  function closePop() { overlay.className = "m-overlay"; }

  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

  // a search word matches when it starts a word in the advisor's text (so "ai" will not match "main")
  function hasWord(text, w) {
    return new RegExp("(^|[^a-z0-9])" + esc(w)).test(text);
  }

  function score(a, words) {
    var fs = a.fields || [];
    var syn = fs.map(function (f) { return f + " " + (FIELD_SYNONYMS[f] || ""); });
    var pool = a.keywords.concat(a.research, fs, syn, [a.name, a.dept]).join(" | ").toLowerCase();
    var hits = [];
    words.forEach(function (w) {
      if (hasWord(pool, w) && hits.indexOf(w) === -1) { hits.push(w); }
    });
    return hits;
  }

  function researchHits(a, hits) {
    var n = 0;
    a.research.forEach(function (t) {
      var tl = t.toLowerCase();
      if (hits.some(function (h) { return hasWord(tl, h); })) { n++; }
    });
    (a.fields || []).forEach(function (f, i) {
      var fl = (f + " " + (FIELD_SYNONYMS[f] || "")).toLowerCase();
      if (hits.some(function (h) { return hasWord(fl, h); })) { n += (i === 0 ? 4 : 2); }   // primary field counts most
    });
    return n;
  }

  function initial(name) {
    var parts = name.replace(/[.,]/g, " ").split(" ").filter(function (p) { return p.length > 0; });
    return parts[parts.length - 1].charAt(0).toUpperCase();
  }

  function buildCard(a, hits) {
    var card = el("div", "m-card");
    if (a.photo) {
      var img = el("img", "m-photo");
      img.src = a.photo;
      img.alt = a.name;
      img.onerror = function () {
        var av = el("div", "m-avatar", initial(a.name));
        card.replaceChild(av, img);
      };
      card.appendChild(img);
    } else {
      card.appendChild(el("div", "m-avatar", initial(a.name)));
    }
    var body = el("div", "m-body");
    body.appendChild(el("div", "m-name", a.name));
    body.appendChild(el("div", "m-dept", a.dept));

    // email + Contact now button, side by side
    var row = el("div", "m-emailrow");
    row.appendChild(el("span", "m-email", a.email));
    var contact = el("a", "m-contact", "Contact now");
    contact.href = "mailto:" + a.email + "?subject=" +
      encodeURIComponent("Inquiry about M.Sc./Ph.D. in Biomedical Sciences");
    row.appendChild(contact);
    body.appendChild(row);

    if (a.fields && a.fields.length) {
      body.appendChild(el("div", "m-rlabel", "Expertise"));
      a.fields.forEach(function (f) {
        var fl = (f + " " + (FIELD_SYNONYMS[f] || "")).toLowerCase();
        var isHit = hits.some(function (h) { return hasWord(fl, h); });
        body.appendChild(el("span", isHit ? "m-tag m-field hit" : "m-tag m-field", f));
      });
    }

    if (a.research.length) {
      body.appendChild(el("div", "m-rlabel", "Research"));
      a.research.forEach(function (t) {
        var tl = t.toLowerCase();
        var isHit = hits.some(function (h) { return hasWord(tl, h); });
        body.appendChild(el("span", isHit ? "m-tag hit" : "m-tag", t));
      });
    }

    // matched terms that are not already shown in the research tags
    var shown = a.research.join(" | ").toLowerCase();
    var extra = a.keywords.filter(function (k) {
      return hits.some(function (h) { return hasWord(k, h); }) && shown.indexOf(k) === -1;
    }).slice(0, 5);
    if (extra.length) {
      body.appendChild(el("div", "m-rlabel", "Also matches"));
      extra.forEach(function (k) { body.appendChild(el("span", "m-tag hit", k)); });
    }
    card.appendChild(body);
    return card;
  }

  function run() {
    var q = input.value.toLowerCase().trim();
    if (!q) { input.focus(); return; }
    var words = q.split(/[\s,]+/).filter(function (w) { return w.length > 1; });
    if (!words.length) { words = [q]; }
    words.slice().forEach(function (w) {
      (ALIASES[w] || []).forEach(function (x) { if (words.indexOf(x) === -1) { words.push(x); } });
    });
    var found = [];
    advisors.forEach(function (a) {
      var hits = score(a, words);
      if (hits.length > 0) { found.push({ a: a, hits: hits, rh: researchHits(a, hits) }); }
    });
    found.sort(function (x, y) {
      return (y.hits.length - x.hits.length) || (y.rh - x.rh) || x.a.name.localeCompare(y.a.name);
    });

    while (out.firstChild) { out.removeChild(out.firstChild); }
    head.textContent = 'Advisors for "' + input.value.trim() + '"';

    if (!found.length) {
      out.appendChild(el("div", "m-empty", "No advisor matched this topic yet. Try a broader term such as cancer, immunology, bacteria, vaccine, or biosensor."));
    } else {
      var shownCount = Math.min(found.length, MAX_RESULTS);
      out.appendChild(el("div", "m-sub", found.length + " advisor" + (found.length > 1 ? "s" : "") + " found" + (found.length > shownCount ? " (showing top " + shownCount + ")" : "")));
      found.slice(0, MAX_RESULTS).forEach(function (f) { out.appendChild(buildCard(f.a, f.hits)); });
    }
    openPop();
  }

  btn.addEventListener("click", run);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); run(); }
  });
  closeBtn.addEventListener("click", closePop);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) { closePop(); } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") { closePop(); } });
})();
