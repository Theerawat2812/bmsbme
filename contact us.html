<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Department of Biomedical Sciences and Biomedical Engineering</title>
<meta name="description" content="Contact the Department of Biomedical Sciences and Biomedical Engineering, Faculty of Medicine, Prince of Songkla University.">

<!-- Web fonts: เหมือนหน้าหลัก (Inter + Sarabun) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="footer.css">

<style>
:root{
  --ink:#2b3a4a;
  --head:#1f3a56;
  --mut:#2f78b8;
  --line:#e6edf3;
  --tint:#f4f9fd;
  --tint2:#e8f3fc;
  --blue:#3f8fd2;
  --blue-dk:#2f78b8;
  --sky:#bfe0f8;
  --icon:#bcd0e2;   /* สีไอคอนใน card: โทนเดียวกับพื้น แต่เข้มกว่าเล็กน้อย */
  --wrap:1320px;
  --font:'Inter','Sarabun',Helvetica,Arial,sans-serif;
}
html{scroll-behavior:smooth}

/* ---------- Base ---------- */
.pg,.pg *{box-sizing:border-box; font-family:var(--font)}
.pg{margin:0; background:#fff; color:var(--ink); font-size:16px; line-height:1.7}
.pg ul{list-style:none; margin:0; padding:0}
.pg a{color:inherit; text-decoration:none}
.pg p{margin:0}
.pg h2,.pg h3{margin:0; font-weight:700; line-height:1.25; color:var(--head)}
.pg a:focus-visible{outline:3px solid var(--sky); outline-offset:3px}
.w{max-width:var(--wrap); margin:0 auto; padding:0 25px}
.sec{padding:25px 0}
.tint{background:var(--tint)}
.tint-blue{background:#fff}
.tag{display:inline-block; font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--blue)}
.pg h2{font-size:25px; margin-top:8px}
.pg .lead{color:var(--mut); max-width:860px; margin-top:12px}

/* ---------- HERO (original — ห้ามแก้) ---------- */
:root{--side:clamp(20px, calc((100vw - 1320px) / 2), 300px)}
#hero{position:relative;height:clamp(280px,19.8vw,380px);overflow:hidden;color:#fff;
  background:url(https://bmsbme.psu.ac.th/filemanager/file/15/businesswoman-reading-message-mobile-phone.jpg) center/cover no-repeat}
#overlay{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,29,51,.78),rgba(10,29,51,.25))}
#hero-text{position:absolute;left:var(--side);right:var(--side);bottom:clamp(28px,3vw,56px);max-width:1200px}
#hero-text .crumb{font-size:clamp(13px,.83vw,15px);margin:0 0 10px;opacity:.85}
#hero-text .crumb a:hover{text-decoration:underline}
#hero-text h1{
    margin: 0 0 10px;
    font-size: 30px;
    line-height: 1.15;
    font-weight: bold;
    color: #fff
}
#hero-text p{
    margin: 0;
    font-size: 18px;
    font-weight: 300;
    max-width: 1640px
}
@media(max-width:600px){#hero{height:320px}}
@media(max-width:900px){
  #hero-text h1{font-size:22px}
  #hero-text p{font-size:14px}
}
@media(max-width:600px){
  #hero-text h1{font-size:20px}
  #hero-text p{font-size:14px}
}

/* ---------- Info cards ---------- */
.cards{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; margin-top:28px}
.card{position:relative; background:#eff4f8; border:0; border-radius:6px; padding:24px 96px 24px 26px; min-height:110px}
.pg .card h3{font-size:18px; margin-bottom:8px}
.card p{font-size:15.5px; color:var(--mut); overflow-wrap:anywhere}
.pg .card a{color:var(--blue-dk); font-weight:600}
.pg .card a:hover{text-decoration:underline}
/* ไอคอนด้านขวาของ card */
.card .ico{position:absolute; right:24px; top:50%; transform:translateY(-50%); width:56px; height:56px; color:var(--icon); pointer-events:none}
.card .ico svg{display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:.75; stroke-linecap:round; stroke-linejoin:round}

/* ---------- Form + map ---------- */
.split{
  --gap:16px;        /* ระยะระหว่างช่องในฟอร์ม */
  --lbl:26px;        /* label 20px + margin 6px */
  --btn:48px;        /* ปุ่ม 24px + padding 12px x2 */
  display:grid; grid-template-columns:1fr 1fr; gap:48px; align-items:stretch;
}
.col-map{display:flex; flex-direction:column}
.pg .split h2{
    margin-bottom: 18px;
    font-weight: 700;
    font-size: 20px;
}
form{display:grid; gap:var(--gap,16px)}
label{display:block; font-size:14px; line-height:20px; font-weight:600; color:var(--head); margin-bottom:6px}
input,textarea{
  width:100%; padding:12px 14px; font:inherit; font-size:16px; color:var(--ink);
  background:#fff; border:1px solid #d9dee3; border-radius:4px; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
input:focus,textarea:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(63,143,210,.18)}
textarea{min-height:150px; resize:vertical}
.btn{display:inline-block; line-height:24px; padding:12px 28px; background:var(--blue); color:#fff; font-weight:700; font-size:16px; border:0; border-radius:4px; cursor:pointer; transition:background .2s, transform .2s, box-shadow .2s}
.btn:hover{background:var(--blue-dk); transform:translateY(-2px); box-shadow:0 8px 20px rgba(47,120,184,.25)}
.map{
  position:relative; width:100%; flex:1; min-height:300px; border:0; border-radius:6px; overflow:hidden; background:var(--tint2);
  margin-top:var(--lbl);                       /* ขอบบนเสมอกับช่องกรอก Name */
  margin-bottom:calc(var(--btn) + var(--gap)); /* ขอบล่างเสมอกับช่อง Message (ไม่รวมปุ่ม) */
}
.map iframe{position:absolute; inset:0; display:block; width:100%; height:100%; border:0}

/* ---------- Responsive: ตัวอักษรและระยะลดลงทีละขั้น ---------- */
@media (max-width:1100px){
  .card{padding-right:80px}
  .card .ico{width:44px; height:44px; right:20px}
}
@media (max-width:1000px){
  .pg .split h2{font-size:19px}
  .card p{font-size:15px}
}
@media (max-width:900px){
  .cards{grid-template-columns:1fr; gap:16px}
  .split{grid-template-columns:1fr; gap:32px}
  .map{flex:none; height:300px; min-height:0; margin:0}
  .pg h2{font-size:22px}
  .pg .split h2{font-size:18px; margin-bottom:16px}
  .pg .card h3{font-size:17px}
  .card{min-height:0}
  label{font-size:13.5px}
}
@media (max-width:600px){
  .pg{font-size:15px}
  .w{padding:0 18px}
  .tag{font-size:11px; letter-spacing:.05em}
  .sec{padding:20px 0}
  .pg h2{font-size:20px}
  .pg .split h2{font-size:17px; margin-top:6px; margin-bottom:14px}
  .cards{margin-top:20px; gap:12px}
  .pg .card h3{font-size:16px; margin-bottom:6px}
  .card{padding:18px 70px 18px 20px}
  .card p{font-size:14px}
  .card .ico{width:38px; height:38px; right:16px}
  label{font-size:13px; margin-bottom:4px}
  input,textarea{padding:10px 12px}  /* คง 16px กัน iOS ซูมเองตอนแตะช่อง */
  textarea{min-height:120px}
  .map{height:260px}
  form{gap:12px}
  .btn{width:100%; font-size:15px; padding:11px 20px}
}
</style>
</head>

<body class="nav-hero">

<!-- ===== Hero ===== -->
<div id="hero">
  <div id="overlay"></div>
  <div id="site-nav"></div>
  <div id="hero-text">
    <h1>Contact us</h1>
    <p>Questions about our programs, admission or research? We are happy to help.</p>
  </div>
</div>

<div class="pg">

<!-- ===== Get in touch ===== -->
<section class="sec">
  <div class="w">
    <div class="cards">
      <div class="card">
        <h3>Address</h3>
        <p>15 Karnjanavanich Road,<br>Hat Yai, Songkhla 90110, Thailand</p>
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
      </div>
      <div class="card">
        <h3>Email</h3>
        <p><a href="mailto:bmsbme@medicine.psu.ac.th">bmsbme@medicine.psu.ac.th</a></p>
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
      </div>
      <div class="card">
        <h3>Phone</h3>
        <p><a href="tel:+66000000000">+66 0-0000-0000</a><br>Mon–Fri, 08:30–16:30</p>
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
      </div>
    </div>
  </div>
</section>

<!-- ===== Form + Map ===== -->
<section class="sec tint-blue">
  <div class="w split">
    <div>
      <span class="tag">Message</span>
      <h2>Send us a message</h2>
      <form id="contact-form">
        <div><label for="f-name">Name</label><input type="text" id="f-name" required></div>
        <div><label for="f-email">Email</label><input type="email" id="f-email" required></div>
        <div><label for="f-subject">Subject</label><input type="text" id="f-subject" required></div>
        <div><label for="f-msg">Message</label><textarea id="f-msg" required></textarea></div>
        <div><button type="submit" class="btn">Send message</button></div>
      </form>
    </div>
    <div class="col-map">
      <span class="tag">Location</span>
      <h2>Find us</h2>
      <div class="map">
        <iframe title="Map" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1003.2499152478294!2d100.4946977677755!3d7.004849342484314!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x304d2964006943d9%3A0xf1bd40246c7ca5b5!2z4Lit4Liy4LiE4Liy4Lij4Lin4Li04LiI4Lix4LiiIOC4meC4p-C4seC4leC4geC4o-C4o-C4oSDguYHguKXguLDguJbguYjguLLguKLguJfguK3guJTguYDguJfguITguYLguJnguYLguKXguKLguLXguIHguLLguKPguYHguJ7guJfguKLguYw!5e0!3m2!1sth!2sth!4v1791219907936!5m2!1sth!2sth"></iframe>
      </div>
    </div>
  </div>
</section>

</div><!-- /.pg -->

<div id="site-footer"></div>

<script>
// ฟอร์มนี้เปิดโปรแกรมอีเมลของผู้ใช้ (ไม่ต้องมี server)
var CONTACT_EMAIL = "bmsbme@medicine.psu.ac.th";
document.getElementById("contact-form").onsubmit = function (e) {
  e.preventDefault();
  var name = document.getElementById("f-name").value;
  var email = document.getElementById("f-email").value;
  var subject = document.getElementById("f-subject").value;
  var msg = document.getElementById("f-msg").value;
  var body = msg + "\n\n--\n" + name + " <" + email + ">";
  window.location.href = "mailto:" + CONTACT_EMAIL +
    "?subject=" + encodeURIComponent(subject) +
    "&body=" + encodeURIComponent(body);
};
</script>

<script src="header.js"></script>
<script src="footer.js"></script>
<script src="cookie.js"></script>
</body>
</html>
