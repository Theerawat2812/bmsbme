<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Research Consultation Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Sarabun:wght@400;500;600;700&family=Sriracha&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       ฟอนต์ที่ไม่มีใน Google Fonts
       วางไฟล์ฟอนต์ไว้ในโฟลเดอร์ "fonts" ข้างไฟล์ HTML นี้ (หรือติดตั้งฟอนต์ในเครื่อง)
         fonts/THSarabunNew.ttf
         fonts/THSarabunNew-Bold.ttf
         fonts/Kart-Satapat.ttf
         fonts/TorsilpYaLuemChan.ttf
       ===================================================================== */
    @font-face { font-family: "TH Sarabun New"; font-weight: 400;
      src: local("TH Sarabun New"), local("THSarabunNew"), url("fonts/THSarabunNew.ttf") format("truetype"); }
    @font-face { font-family: "TH Sarabun New"; font-weight: 700;
      src: local("TH Sarabun New Bold"), local("THSarabunNew-Bold"), local("THSarabunNew Bold"), url("fonts/THSarabunNew-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Kart-Satapat";
      src: local("Kart-Satapat"), local("Kart Satapat"), local("KartSatapat"), url("fonts/Kart-Satapat.ttf") format("truetype"); }
    @font-face { font-family: "Torsilp YaLuemChan";
      src: local("Torsilp YaLuemChan"), local("TorsilpYaLuemChan"), local("Torsilp-YaLuemChan"), url("fonts/TorsilpYaLuemChan.ttf") format("truetype"); }

    /* ===== Theme: เปลี่ยนสีหลักได้ที่นี่ที่เดียว ===== */
    :root {
      --bg: #f7f7f7;        /* พื้นหลังเว็บ */
      --card: #ffffff;
      --ink: #14213d;       /* สีตัวอักษรหลัก */
      --muted: #5b6b85;     /* ตัวอักษรรอง */
      --line: #dbe3ef;      /* เส้นขอบ */
      --primary: #46538c;   /* สีปุ่ม / สีเน้น */
      --primary-soft: #e9ebf4;
      --ok: #16794c;
      --bad: #b42318;
      --page: 1200px;       /* ความกว้างสูงสุดของเนื้อหา (main) */

      /* ระยะซ้าย-ขวาของ header (โลโก้/ชื่อบริการ) และ nav (เมนู) ปรับที่เดียวตรงนี้
         20px = ระยะต่ำสุดตอนจอแคบ | 1320px = ความกว้างกรอบ | 300px = ระยะสูงสุดต่อข้าง */
      --nav-pad: clamp(20px, calc((100vw - 1320px) / 2), 300px);

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* กันมือถือขยายตัวอักษรเอง (ทำให้เอกสารเพี้ยน) */
    * { box-sizing: border-box; }

    /* ฟอนต์: อังกฤษ = Arial, ไทย = Noto Sans Thai */
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 Arial, 'Noto Sans Thai', sans-serif;
    }

    /* ===== Header / Navigation ===== */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px var(--nav-pad);       /* ระยะซ้าย-ขวา ใช้ --nav-pad */
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .brand { margin-left: auto; text-align: right; font-weight: 700; color: var(--primary); }  /* ชื่อบริการอยู่ขวา */
    .logo { order: -1; height: 40px; width: auto; cursor: pointer; }                          /* โลโก้อยู่ซ้าย กดกลับหน้า Home */

    /* โครงหน้า: เมนูซ้าย (แนวตั้ง) + เนื้อหาขวา */
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .layout {
      flex: 1;
      display: flex;
      align-items: flex-start;
      gap: 28px;
      padding: 24px var(--nav-pad) 40px;     /* ระยะซ้าย-ขวาใช้ --nav-pad เหมือน header */
    }

    /* เมนูซ้าย: เรียงลงล่างเป็นแถว (ไม่ใช่ปุ่ม) */
    nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: none;
      width: 220px;
      position: sticky;
      top: 16px;
      padding: 0;
      margin: 0;
      border-left: 1px solid var(--line);
    }
    nav button {
      width: 100%;
      text-align: left;
      display: flex; align-items: center; gap: 10px;     /* ไอคอน + ข้อความ */
      padding: 10px 16px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0 8px 8px 0;
      background: none;
      color: var(--ink);
      margin-left: -1px;
    }
    nav .nav-ico { width: 18px; height: 18px; flex: none; }   /* สีตาม currentColor = สีตัวอักษรเมนู */
    nav button:hover { background: var(--primary-soft); }
    nav button.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 700;
    }

    main { flex: 1; min-width: 0; max-width: var(--page); margin: 0; padding: 0; }

    /* ===== Footer (ทุกหน้า) ===== */
    footer {
      padding: 18px var(--nav-pad);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      background: var(--card);
      border-top: 1px solid var(--line);
    }

    /* ===== Basic elements ===== */
    h1 { font-size: 30px; line-height: 1.25; margin: 0 13 0px; }
    h2 { font-size: 20px; margin: 0 0 4px; }
    h3 { font-size: 16px; margin: 0 0 6px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    button {
      font: inherit;
      cursor: pointer;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
    }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
    }
    input[type=checkbox], input[type=radio] { width: auto; }
    textarea { min-height: 90px; }
    input, select { height: 44px; }                       /* ช่องกรอกและ dropdown สูงเท่ากัน */
    input[type=checkbox], input[type=radio], input[type=file] { height: auto; }

    label { display: block; margin: 12px 0 4px; font-weight: 500; }
    label small { font-weight: 400; color: var(--muted); }

    /* ตัวเลือกแบบเรียบ ๆ (KPI / Working Hour) พื้นหลังขาว ไม่มีกรอบสี */
    .plain-options { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 4px 0; }
    .plain-options label {
      display: inline-flex; gap: 8px; align-items: center;
      margin: 0; font-weight: 400; cursor: pointer; background: none;
    }
    .plain-options input { margin: 0; accent-color: var(--primary); }

    /* ===== Cards & layout ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }
    .hero { position: relative; overflow: hidden; padding: 36px 28px; background: linear-gradient(135deg, #e9ebf4, #fff); }
    .hero > *:not(.hero-art) { position: relative; z-index: 1; }
    .hero-art {                               /* ภาพเวกเตอร์เอกสาร สีจาง ๆ ไม่เด่น */
      position: absolute; z-index: 0; pointer-events: none;
      right: 36px; top: 50%; transform: translateY(-50%) rotate(6deg);
      width: 190px; height: auto; color: var(--primary); opacity: .1;
    }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); }
    .two  { display: grid; gap: 0 14px; grid-template-columns: 1fr 1fr; }
    .info-box { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--card); }
    .bar { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
    .error { color: var(--bad); margin-top: 8px; }

    /* ===== Home: timeline "How it works" ===== */
    .timeline .item { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
    .timeline .item::before {            /* เส้นเชื่อมระหว่างข้อ */
      content: '';
      position: absolute; left: 15px; top: 34px; bottom: 2px;
      width: 2px; background: var(--line);
    }
    .timeline .item:last-child::before { display: none; }
    .timeline .num {
      flex: none; width: 32px; height: 32px;
      display: grid; place-items: center;
      border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700;
    }

    /* ===== แถบแสดงความคืบหน้าของงาน (ทั้งฝั่งผู้ขอและอาจารย์) ===== */
    .process { padding: 16px 18px; }
    .process .p-title { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
    .process .p-title b { color: var(--primary); }
    .process .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .process .st .line { height: 4px; border-radius: 4px; background: var(--line); margin-bottom: 8px; }
    .process .st .name { font-size: 12px; line-height: 1.3; color: var(--muted); }
    .process .st .name small { display: block; font-size: 11px; opacity: .85; }
    .process .st.passed .line { background: var(--ok); }
    .process .st.passed .name { color: var(--ok); }
    .process .st.current .line { background: var(--primary); }
    .process .st.current .name { color: var(--primary); font-weight: 700; }
    .process.compact { padding: 0; margin: 8px 0 0; border: 0; background: none; border-radius: 0; }
    .process.compact .steps { gap: 4px; max-width: 260px; }
    .process.compact .st .line { margin: 0; height: 5px; }

    /* ===== Hamburger (มือถือ) ===== */
    #burger { display: none; flex: none; position: relative; width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    #burger span { position: absolute; left: 11px; right: 11px; height: 2px; border-radius: 2px; background: var(--primary); transition: transform .25s, opacity .2s, top .25s; }
    #burger span:nth-child(1) { top: 14px; }
    #burger span:nth-child(2) { top: 21px; }
    #burger span:nth-child(3) { top: 28px; }
    body.menu-open #burger span:nth-child(1) { top: 21px; transform: rotate(45deg); }
    body.menu-open #burger span:nth-child(2) { opacity: 0; }
    body.menu-open #burger span:nth-child(3) { top: 21px; transform: rotate(-45deg); }
    #menu-backdrop { display: none; }
    @keyframes menuDrop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    /* ===== Wizard: stepper ===== */
    .stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
    .stepper .num  { font-size: 22px; font-weight: 700; color: var(--muted); }
    .stepper .name { font-size: 13px; margin-bottom: 8px; color: var(--muted); }
    .stepper .line { height: 4px; border-radius: 4px; background: var(--line); }
    .stepper .current .num, .stepper .current .name { color: var(--primary); }
    .stepper .current .line { background: var(--primary); }
    .stepper .passed .num, .stepper .passed .name { color: var(--ok); }
    .stepper .passed .line { background: var(--ok); }

    /* ===== Wizard: choices, chips, advisors ===== */
    .choice {
      display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
      padding: 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg);
    }
    .choice.selected { border-color: var(--primary); background: var(--primary-soft); }
    .choice b { display: block; }
    .choice > div, .advisor > div { min-width: 0; overflow-wrap: anywhere; }

    .chip {
      display: inline-flex; gap: 6px; align-items: center;
      margin: 3px 4px 3px 0; padding: 3px 10px;
      border-radius: 99px; font-size: 13px;
      background: var(--primary-soft); color: var(--primary);
      max-width: 100%; overflow-wrap: anywhere;
    }
    .chip a { cursor: pointer; }

    .advisor {
      display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
      padding: 12px; margin-bottom: 8px;
      border: 1.5px solid var(--line); border-radius: 12px;
    }
    .advisor.selected { border-color: var(--primary); background: var(--primary-soft); }
    .advisor-list {
      max-height: 420px; overflow: auto; padding: 14px;
      border: 1px solid #d9d9d9; border-radius: 12px;          /* กรอบเส้นบาง สีเทา */
    }
    .advisor-list .advisor:last-child { margin-bottom: 0; }
    .avatar { flex: none; width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); background: var(--primary-soft); }
    .advisor .pick { flex: none; margin: 4px 0 0 auto; accent-color: var(--primary); }

    .tag {
      display: inline-block; margin-right: 4px; padding: 1px 8px;
      border: 1px solid ; border-radius: 6px;
      font-size: 12px; color: var(--muted); white-space: nowrap;
    }
    .tag.match { border-color: var(--ok); color: var(--ok); }
    .dropzone { padding: 16px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; }

    /* ===== Review table / task status ===== */
    table { width: 100%; border-collapse: collapse; }
    td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
    td:first-child { width: 36%; color: var(--muted); }
    .status { padding: 2px 10px; border-radius: 99px; font-size: 12px; }
    .status.new  { background: #fef3c7; color: #92400e; }
    .status.done { background: #dcfce7; color: #166534; }

    /* ===== หน้างานอาจารย์ / popup ===== */
    .task-card { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; cursor: pointer; }
    .status.sent { background: #e0e7ff; color: #3730a3; }
    .status.review { background: #fce7f3; color: #9d174d; }
    .status.accepted { background: #cffafe; color: #155e75; }
    .check-line { display: inline-flex; gap: 8px; align-items: center; margin: 0; font-weight: 400; cursor: pointer; }
    .check-line input { margin: 0; accent-color: var(--primary); width: 18px; height: 18px; }
    .notice { background: var(--primary-soft); border: 1px solid var(--primary); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; overflow-wrap: anywhere; }
    .notice ul { margin: 6px 0 0; padding-left: 20px; }
    .mail-ok  { color: var(--ok); }
    .mail-bad { color: var(--bad); }
    .sig-gen button { height: 44px; }                 /* สูงเท่าช่องกรอกชื่อ อยู่ระนาบเดียวกัน */
    .sig-tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 10px; }
    .sig-tile { padding: 8px; background: #fff; border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
    .sig-tile.selected { border-color: var(--primary); }
    .sig-tile img { width: 100%; display: block; }
    .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(20, 33, 61, .55); }
    .modal-box { max-width: 360px; padding: 24px; text-align: center; background: #fff; border-radius: 16px; }
    .modal-box img { width: 200px; height: 200px; }
    .signature { display: block; max-height: 100px; }

    /* ===== เอกสาร AS-001: A4 (210 x 297 mm) ใช้ TH Sarabun New ทั้งฉบับ ===== */
    .doc-wrap { overflow: hidden; padding: 12px; border-radius: 8px; background: #e5e5e5; }   /* ย่อให้พอดีจอด้วย fitDocs() */
    .doc {
      width: 210mm; min-height: 297mm; margin: 0 auto; padding: calc(14mm * var(--vs, 1)) 18mm;
      display: flex; flex-direction: column;
      background: #fff; color: #111; border: 1px solid #bbb;
      font-family: 'TH Sarabun New', 'Sarabun', sans-serif;
      font-size: 22px; line-height: 1.3;
    }
    .doc-head { display: flex; justify-content: space-between; font-size: 20px; padding-bottom: 6px; border-bottom: 2px solid #1f6f9f; }
    .doc h3 { margin: calc(36px * var(--vs, 1)) 0 calc(14px * var(--vs, 1)); text-align: center; font-size: 20px; font-weight: 700; }
    .doc h4 { margin: calc(18px * var(--vs, 1)) 0 4px; font-size: 20px; font-weight: 700; }
    .doc .row { display: flex; gap: 8px; align-items: flex-end; margin: calc(7px * var(--vs, 1)) 0; white-space: nowrap; }
    .doc .spread { gap: 18px; align-items: center; }
    .doc .spread > span { white-space: nowrap; }
    .doc .bullet { display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: #111; vertical-align: middle; }

    /* กล่องติ๊กถูก: วาดด้วย CSS ล้วน (ไม่ใช้รูป/ฟอนต์ เพื่อให้สร้าง PDF ได้) */
    .doc .cb {
      position: relative;
      display: inline-block; width: 20px; height: 20px; vertical-align: -6px; margin-right: 4px;
      border: 2px solid #111; border-radius: 3px;
    }
    .doc .cb.on::after {                       /* เครื่องหมายถูก */
      content: ""; position: absolute; left: 4px; top: -1px;
      width: 5px; height: 11px;
      border: solid #111; border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    /* ช่องกรอก = ข้อความอยู่เหนือเส้นจุดไข่ปลา (เส้นจุดวาดด้วย gradient ไม่ใช้รูป) */
    .doc .v { flex: 1; min-height: 26px; padding: 0 6px 2px; white-space: normal; }
    .dots-row {
      background: radial-gradient(circle at 1.5px 4.5px, #111 .9px, transparent 1.2px) left bottom / 6px 6px repeat-x;
    }
    .doc .summary {      /* ข้อมูลโดยสรุป: เส้นจุดไข่ปลาทุกบรรทัด ข้อความตัดขึ้นบรรทัดใหม่ตามเส้นจุด */
      min-height: calc(160px * var(--vs, 1)); line-height: 32px;
      background: radial-gradient(circle at 1.5px 29.5px, #111 .9px, transparent 1.2px) left top / 6px 32px repeat;
      white-space: normal;
      overflow-wrap: anywhere;      /* ตัดบรรทัดแม้เป็นข้อความยาวไม่มีเว้นวรรค */
      word-break: break-word;
    }

    /* ส่วนล่าง: QR ซ้าย / ลายเซ็นขวา */
    .doc .bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: calc(22px * var(--vs, 1)); }
    .doc .qr { width: 190px; text-align: center; }
    .doc .qr img { width: 130px; height: 130px; display: block; margin: 0 auto 8px; }
    .doc .sign-col { width: 270px; text-align: center; }
    .doc .sign-box { height: calc(90px * var(--vs, 1)); display: flex; align-items: flex-end; justify-content: center; }
    .doc .sign-box img { max-height: 100%; max-width: 100%; object-fit: contain; }
    .doc .sign-line { height: 6px; margin: 0 10px 2px; }
    .doc .sign-col > div + div { margin-top: calc(22px * var(--vs, 1)); }
    .doc .doc-foot { margin-top: auto; padding-top: calc(26px * var(--vs, 1)); }                       /* ดันลงล่างสุดของกระดาษ */
    .doc .doc-foot .rule { height: 6px; margin: 0 40px 18px; }
    .doc .doc-foot .checks { display: flex; gap: 60px; align-items: center; }

    /* ===== ฟอนต์: ใช้ TH Sarabun New ทั้งฟอร์ม (ตั้งที่เดียว) ===== */
    .doc, .doc *, .doc *::before, .doc *::after {
      font-family: 'TH Sarabun New', 'Sarabun', sans-serif !important;
    }

    /* ===== ขนาดตัวอักษรแยกแต่ละส่วน (แก้เลขได้เลย) ===== */

    /* ข้อความทั่วไปทั้งฟอร์ม (ค่าเริ่มต้นของส่วนที่ไม่ได้ระบุด้านล่าง) */
    .doc                     { font-size: 22px; font-weight: 400; }

    /* หัวกระดาษ: "สาขาวิชาชีวเวชศาสตร์..." (ซ้าย) */
    .doc-head > span         { font-size: 22px !important; font-weight: 400 !important; }

    /* หัวกระดาษ: "AS-001" (ขวา) */
    .doc-head > b            { font-size: 22px !important; font-weight: 400 !important; }

    /* ชื่อแบบฟอร์ม: "แบบฟอร์มรับคำปรึกษา (บริการวิชาการ)" */
    .doc h3                  { font-size: 20px !important; font-weight: 600 !important; }

    /* หัวข้อส่วน: "ส่วนที่ 1 / 2 / 3" */

/* =====================================================================
   0) EMAIL CONFIG  (การส่งอีเมลจริง)
   ---------------------------------------------------------------------
   หน้าเว็บนี้ส่งอีเมลผ่านบริการ EmailJS (https://www.emailjs.com)
   วิธีตั้งค่า:
     1. สมัคร EmailJS แล้วเชื่อมบัญชีอีเมลผู้ส่ง (Email Services) -> ได้ serviceId
     2. สร้าง Email Template ที่มีตัวแปร  {{to_email}}  {{subject}}  {{message}}
        - ช่อง "To email" ใส่ {{to_email}}
        - ช่อง "Subject" ใส่ {{subject}}
        - เนื้อหา ใส่ <div style="white-space:pre-wrap">{{message}}</div>
        -> ได้ templateId
     3. ที่ Account -> API keys คัดลอก Public Key
   ระหว่างทดสอบ ใส่อีเมลตัวเองใน testRecipient เพื่อไม่ให้อีเมลหลุดไปถึงอาจารย์จริง
   ===================================================================== */
const EMAIL_CONFIG = {
  serviceId: "",
  templateId: "",
  publicKey: "",
  testRecipient: "",      // ถ้าใส่ ทุกอีเมลจะถูกส่งมาที่ที่อยู่นี้แทน (ใช้ตอนทดสอบ) ตอนใช้งานจริงให้ว่างไว้
  fromName: "Research Consultation Service"
};

async function sendEmail(to, subject, message) {
  const c = EMAIL_CONFIG;
  if (!c.serviceId || !c.templateId || !c.publicKey) {
    return { ok: false, to, error: "ยังไม่ได้ตั้งค่า EMAIL_CONFIG (ดูคำอธิบายที่ส่วนบนของสคริปต์)" };
  }
  const target = c.testRecipient || to;
  try {
    const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: c.serviceId,
        template_id: c.templateId,
        user_id: c.publicKey,
        template_params: { to_email: target, subject, message, from_name: c.fromName, original_to: to }
      })
    });
    if (!res.ok) throw new Error((await res.text()) || res.status);
    return { ok: true, to: target };
  } catch (err) {
    return { ok: false, to, error: err.message };
  }
}

// ส่งหลายฉบับพร้อมกัน jobs = [[to, subject, message], ...]
const sendAll = jobs => Promise.all(jobs.map(([to, subject, message]) => sendEmail(to, subject, message)));

// สรุปผลการส่งเป็น HTML

  return `<ul>${results.map(r => r.ok
    ? `<li class="mail-ok">✓ ส่งอีเมลถึง ${esc(r.to)} แล้ว</li>`
    : `<li class="mail-bad">✗ ส่งถึง ${esc(r.to)} ไม่สำเร็จ: ${esc(r.error)}</li>`).join("")}</ul>`;

// ป้องกัน HTML injection เวลาแสดงข้อความที่ผู้ใช้พิมพ์
function esc(text) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
  return String(text ?? "").replace(/[&<>"]/g, c => map[c]);
}

// เอกสาร AS-001 ต้องพอดี A4 หน้าเดียว: ถ้าเนื้อหายาวเกิน ค่อย ๆ บีบระยะห่างแนวตั้ง (--vs) จนพอดี
function tightenDoc(doc) {
  const limit = 297 * 96 / 25.4;                 // ความสูง A4 เป็นพิกเซล
  let vs = 1;
  doc.style.setProperty("--vs", vs);
  while (doc.offsetHeight > limit + 1 && vs > 0.3) {
    vs = Math.round((vs - 0.05) * 100) / 100;
    doc.style.setProperty("--vs", vs);
  }
}

// ย่อเอกสาร AS-001 ให้พอดีความกว้างหน้าจอ (มือถือ) ไม่ย่อถ้าจอกว้างพอ
function fitDocs() {
  document.querySelectorAll(".doc-wrap").forEach(wrap => {
    const doc = wrap.querySelector(".doc");
    if (!doc) return;
    doc.style.transform = "";                    // วัดความสูงจริงก่อนย่อตามจอ
    tightenDoc(doc);
    const cs = getComputedStyle(wrap);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const scale = Math.min(1, (wrap.clientWidth - padX) / doc.offsetWidth);
    if (scale < 1) {
      doc.style.transformOrigin = "top left";
      doc.style.transform = `scale(${scale})`;
      doc.style.marginLeft = "0";
      wrap.style.height = (doc.offsetHeight * scale + padY) + "px";
    } else {
      doc.style.transform = "";
      doc.style.marginLeft = "";
      wrap.style.height = "";
    }
  });
}
window.addEventListener("resize", fitDocs);
if (document.fonts) document.fonts.ready.then(fitDocs);

  const body = [stepContact, stepNeeds, stepTopic, stepReview][state.step - 1]();

    ? `<button class="primary" onclick="changeStep(1)">Next</button>`

  return `

    <div class="card">

      <div class="bar">
        <button onclick="changeStep(-1)" ${state.step === 1 ? "disabled" : ""}>Back</button>

// ให้คะแนนอาจารย์ตามคีย์เวิร์ดที่ผู้ใช้ใส่ (ตรงทั้งวลี +2, ตรงรายคำ +1)
function scoreAdvisor(advisor) {
  let score = 0;
  state.keywords.forEach(keyword => {
    const k = keyword.toLowerCase();
    [k, ALIASES[k]].filter(Boolean).forEach(term => {
      if (advisor.haystack.includes(term)) score += 2;
    });
    k.split(/\s+/).forEach(word => {
      if (word.length > 3 && advisor.haystack.includes(word)) score += 1;
    });
  });
  return score;
}

// กรอง (ตามสาขา / ช่องค้นหา) แล้วเรียงตามคะแนน
function findAdvisors() {
  const q = state.search.toLowerCase();
  return ADVISORS
    .map((advisor, index) => ({ advisor, index, score: scoreAdvisor(advisor) }))
    .filter(({ advisor }) =>
      (state.fieldFilter === "" || advisor.fields.includes(Number(state.fieldFilter))) &&
      (!q || advisor.haystack.includes(q) || advisor.name.toLowerCase().includes(q)))
    .sort((a, b) => b.score - a.score || a.index - b.index);
}

function advisorListHtml(matches) {
  if (!matches.length) return `<div class="muted">No advisor found</div>`;

  return matches.map(({ advisor, index, score }) => {
    const on = state.selectedAdvisors.includes(index);
    return `
      <div class="advisor ${on ? "selected" : ""}" onclick="pickAdvisor(${index})">
        <img class="avatar" src="${advisor.photo}" alt=""
             onerror="this.onerror=null;this.src=ADVISORS[${index}].avatar">
        <div>
          <b>${esc(advisor.name)}</b> ${score ? '<span class="tag match">match</span>' : ""}
          <div class="small muted">${advisor.dept}</div>
          <div style="margin:3px 0">${advisor.fields.map(i => `<span class="tag">${FIELDS[i]}</span>`).join("")}</div>
          <div class="small muted">${esc(advisor.research)}</div>
        </div>
        <input type="radio" class="pick" ${on ? "checked" : ""} tabindex="-1">
      </div>`;
  }).join("");
}

// พิมพ์ในช่องค้นหาแล้ว render ใหม่ โดยคงตำแหน่งเคอร์เซอร์ไว้
function onSearch(value) {
  state.search = value;
  render();
  const input = $("search");
  input.focus({ preventScroll: true });
  input.setSelectionRange(value.length, value.length);
}

function addKeyword(input) {
  const value = input.value.trim();
  if (value && !state.keywords.includes(value)) state.keywords.push(value);
  render();
  $("kw").focus({ preventScroll: true });
}
function removeKeyword(i) { state.keywords.splice(i, 1); render(); }

function pickAdvisor(index) {
  state.error = "";
  // เลือกได้ 1 ท่าน: กดคนใหม่ = เปลี่ยนคน, กดคนเดิมซ้ำ = ยกเลิก
  state.selectedAdvisors = state.selectedAdvisors[0] === index ? [] : [index];

  const list = document.querySelector(".advisor-list");
  const scrollTop = list.scrollTop;     // คงตำแหน่งที่เลื่อนอยู่
  render();
  document.querySelector(".advisor-list").scrollTop = scrollTop;
}

function addFiles(input) {
  state.error = "";
  Array.from(input.files).forEach(file => {
    if (!/\.(pdf|jpe?g)$/i.test(file.name)) state.error = "รองรับเฉพาะ PDF และ JPEG";
    else if (file.size > 10 * 1024 * 1024) state.error = "ไฟล์ใหญ่เกิน 10 MB";
    else state.files.push(file.name);   // ของจริง: อัปโหลดไฟล์ไปเก็บที่ server
  });
  render();
}
function removeFile(i) { state.files.splice(i, 1); render(); }

/* ---------- Step 4: ตรวจสอบก่อนส่ง ---------- */
function stepReview() {
  const f = state.form;
  const needsText = state.needs.map(n => n === "Other" ? "Other: " + state.otherNeed : n).join(", ");
  const advisorsHtml = state.selectedAdvisors.map(i =>
    `${esc(ADVISORS[i].name)} <span class="muted small">· ${ADVISORS[i].email}</span>`).join("<br>");

  const rows = [
    ["Name", esc(f.name)],
    ["Position", esc(`${f.position} (${POSITIONS[f.position]})`)],
    ["Affiliation", esc(f.affiliation)],
    ["Email / Telephone", esc(`${f.email} · ${f.tel}`)],
    ["Needs", esc(needsText)],
    ["Topic", esc(state.topic)],
    ["Details", esc(state.details || "—")],
    ["Keywords", esc(state.keywords.join(", ") || "—")],
    ["Advisor", advisorsHtml],
    ["Files", esc(state.files.join(", ") || "—")]
  ];

  return `
    <h2>Review your requirement</h2>
    <table>${rows.map(([label, value]) => `<tr><td>${label}</td><td>${value}</td></tr>`).join("")}</table>
    <p class="muted small">
      เมื่อกด Submit ระบบจะส่งอีเมลแจ้งอาจารย์ที่เลือก (และส่งอีเมลยืนยันถึงคุณ) และงานจะปรากฏในหน้า Task ของอาจารย์
      · ข้อมูลจะถูกลบอัตโนมัติใน 30 วัน
    </p>`;
}

/* ---------- ปุ่ม Next / Back + ตรวจความถูกต้อง ---------- */
function changeStep(direction) {
  state.error = "";
  const f = state.form;

  if (direction > 0) {
    if (state.step === 1) {
      const emailOk = /\S+@\S+\.\S+/.test(f.email);
      if (!(f.name && f.position && f.affiliation && emailOk && f.tel)) {
        state.error = "กรุณากรอกข้อมูลให้ครบ และตรวจสอบอีเมล";
        return render();
      }
    }
    if (state.step === 2) {
      const needsOther = state.needs.includes("Other") && !state.otherNeed.trim();
      if (!state.needs.length || needsOther) {
        state.error = "กรุณาเลือกอย่างน้อย 1 ข้อ (และระบุหากเลือก Other)";
        return render();
      }
    }
    if (state.step === 3 && (!state.topic.trim() || !state.selectedAdvisors.length)) {
      state.error = "กรุณากรอกชื่อเรื่องและเลือกอาจารย์อย่างน้อย 1 ท่าน";
      return render();
    }
  }
  state.step += direction;
  resetScroll = true;
  render();
}

/* ---------- Submit: สร้างงานให้อาจารย์แต่ละท่านที่เลือก + ส่งอีเมลจริง ---------- */
async function submitRequest() {
  const ids = [];
  const jobs = [];                       // อีเมลที่ต้องส่ง [to, subject, message]
  const f = { ...state.form };
  const needsText = state.needs.map(n => n === "Other" ? "Other: " + state.otherNeed : n).join(", ");

  state.selectedAdvisors.forEach(advisorIndex => {
    const id = "RC-" + ("000" + (tasks.length + 1)).slice(-4);
    const advisor = ADVISORS[advisorIndex];
    ids.push(id);
    tasks.push({
      id,
      requester: { ...f },
      needs: [...state.needs],
      otherNeed: state.otherNeed,
      topic: state.topic,
      details: state.details,
      keywords: [...state.keywords],
      advisor: advisorIndex,
      files: [...state.files],
      created: Date.now(),
      status: "new",
      consultDone: false,
      purpose: null,          // อาจารย์เลือกตอนลงลายเซ็น (ขั้นสุดท้าย)
      advisorSig: null,
      result: null
    });

    // อีเมลถึงอาจารย์
    jobs.push([advisor.email, `[Research Consultation] คำขอรับคำปรึกษาใหม่ ${id}: ${state.topic}`,
`เรียน ${advisor.name}

มีผู้ขอรับคำปรึกษาถึงท่าน (Ref: ${id})

ผู้ขอ: ${f.name} (${f.position})
หน่วยงาน: ${f.affiliation}
อีเมล: ${f.email}
โทรศัพท์: ${f.tel}

เรื่อง: ${state.topic}
ประเภทที่ต้องการปรึกษา: ${needsText}
รายละเอียด: ${state.details || "-"}
คีย์เวิร์ด: ${state.keywords.join(", ") || "-"}
ไฟล์แนบ: ${state.files.join(", ") || "-"}

กรุณาติดต่อผู้ขอเพื่อนัดหมายวันให้คำปรึกษา และเปิดหน้า Advisor Tasks เพื่อดูรายละเอียด
${APP_URL()}

Research Consultation Service`]);
  });

  // อีเมลยืนยันถึงผู้ขอ
  jobs.push([f.email, `[Research Consultation] ได้รับคำขอของคุณแล้ว (${ids.join(", ")})`,
`เรียน ${f.name}

ระบบได้ส่งคำขอรับคำปรึกษาเรื่อง "${state.topic}" ถึงอาจารย์ดังนี้แล้ว
${state.selectedAdvisors.map(i => "- " + ADVISORS[i].name).join("\n")}

เลขอ้างอิง: ${ids.join(", ")}
อาจารย์จะติดต่อกลับเพื่อนัดหมายวันให้คำปรึกษา

Research Consultation Service`]);

  state.submitted = { ids, emails: state.selectedAdvisors.map(i => ADVISORS[i].email), results: null };

  // ล้างฟอร์ม
  state.form = { name: "", position: "", affiliation: "", email: "", tel: "" };
  state.needs = []; state.otherNeed = ""; state.topic = ""; state.details = "";
  state.keywords = []; state.selectedAdvisors = []; state.files = [];
  resetScroll = true;
  render();                              // แสดงหน้า "กำลังส่งอีเมล…"

  const submitted = state.submitted;
  submitted.results = await sendAll(jobs);
  if (state.submitted === submitted && state.view === "request") render();
}

function renderSubmitted() {
  const s = state.submitted;
  return processHtml({ id: s.ids.join(", "), status: "new" }) + `
    <div class="card" style="text-align:center;padding:40px 20px">
      <div style="font-size:44px">${s.results ? "✅" : "⏳"}</div>
      <h2>${s.results ? "Request submitted" : "Sending emails…"}</h2>
      <p class="muted">คำขอถูกส่งถึง<br><b>${s.emails.join("<br>")}</b></p>
      <p class="small muted">Ref: ${s.ids.join(", ")}</p>
      <div style="text-align:left;max-width:520px;margin:0 auto 16px" class="small">
        ${s.results ? mailResultHtml(s.results) : `<span class="muted">กำลังส่งอีเมล กรุณารอสักครู่</span>`}
      </div>
      <button class="primary" onclick="state.submitted = null; state.step = 1; showView('home')">Back to home</button>
    </div>`;
}

/* =====================================================================
   7) ADVISOR TASKS  (อาจารย์: รับงาน -> ให้คำปรึกษา -> ส่งฟอร์มให้ผู้ขอ -> [ผู้ขอกรอก+เซ็น] -> อาจารย์เซ็นสุดท้าย -> Complete)
   ===================================================================== */

const STATUS_LABEL = { new: "New", accepted: "In consultation", sent: "Waiting for requester", review: "Waiting for advisor signature", done: "Completed" };

function renderTasks() {
  const myTasks = tasks.filter(t => t.advisor === currentAdvisor);

  const openTaskNow = myTasks.find(t => t.id === openTaskId);
  let html = (openTaskNow ? processHtml(openTaskNow) : "") + takeNotice();   // แถบความคืบหน้าอยู่บนสุด

  html += `
    <div class="card">
      <h2>Advisor Tasks</h2>
      <label>Signed in as <small>(demo — ของจริงใช้ PSU login)</small></label>
      <select onchange="currentAdvisor = Number(this.value); openTaskId = null; sigs.advisor = newSig(); render()">
        ${ADVISORS.map((a, i) => `<option value="${i}" ${i === currentAdvisor ? "selected" : ""}>${esc(a.name)}</option>`).join("")}
      </select>
    </div>`;

  if (!myTasks.length) return html + `<div class="card muted">ยังไม่มีงานที่ได้รับมอบหมาย</div>`;

  html += myTasks.map(t => `
    <div class="card task-card" style="${openTaskId === t.id ? "border-color:var(--primary)" : ""}"
         onclick="openTask('${t.id}')">
      <div style="flex:1;min-width:220px">
        <span class="status ${t.status}">${STATUS_LABEL[t.status]}</span> <b>${esc(t.topic)}</b>
        <div class="small muted">${t.id} · ${esc(t.requester.name)} · ${t.needs.join(", ")} · ลบอัตโนมัติใน ${daysLeft(t)} วัน</div>
        ${processHtml(t, true)}
      </div>
      ${t.status === "new" ? `<button class="primary" onclick="event.stopPropagation(); acceptTask('${t.id}')">Accept requirement</button>` : ""}
      ${t.status === "review" ? `<button class="primary">Sign &amp; complete</button>` : ""}
    </div>`).join("");

  const open = myTasks.find(t => t.id === openTaskId);
  return html + (open ? renderTaskDetail(open) : "");
}

function openTask(id) {
  if (openTaskId !== id) sigs.advisor = newSig();
  openTaskId = id;
  render();
}

function renderTaskDetail(task) {
  const r = task.requester;
  const rows = [
    ["Requester", `${r.name} (${r.position})`],
    ["Affiliation", r.affiliation],
    ["Contact", `${r.email} · ${r.tel}`],
    ["Needs", task.needs.join(", ") + (task.otherNeed ? " — " + task.otherNeed : "")],
    ["Details", task.details || "—"],
    ["Keywords", task.keywords.join(", ") || "—"],
    ["Files", task.files.join(", ") || "—"]
  ];

  let actionPanel = "";
  if (task.status === "new") {
    // ขั้นที่ 1: อาจารย์รับเรื่อง
    actionPanel = `
      <div class="card">
        <h2>Accept requirement</h2>
        <div class="muted small">ตรวจสอบคำขอด้านบน แล้วกดรับเรื่อง จากนั้นติดต่อผู้ขอเพื่อนัดหมายวันให้คำปรึกษา</div>
        <div class="bar" style="justify-content:flex-start"><button class="primary" onclick="acceptTask('${task.id}')">Accept requirement</button></div>
      </div>`;
  } else if (task.status === "accepted") {
    actionPanel = `
      <div class="card">
        <h2>Consultation in progress</h2>
        <div class="muted small">รับเรื่องแล้ว เมื่อให้คำปรึกษาเสร็จ ให้ติ๊กยืนยันที่ด้านล่าง แล้วส่งแบบฟอร์มให้ผู้ขอรับคำปรึกษากรอกและลงลายเซ็น</div>
      </div>`;
  } else if (task.status === "review") {
    // ขั้นสุดท้าย: ผู้ขอกรอกแล้ว อาจารย์เลือกวัตถุประสงค์ ตรวจ และเซ็นปิดงาน
    actionPanel = `
      <div class="card">
        <h2>Sign &amp; complete</h2>
        <div class="muted small">ผู้ขอกรอกและลงลายเซ็นแล้ว ตรวจสอบเอกสารด้านล่าง เลือกวัตถุประสงค์ แล้วลงลายเซ็นผู้ให้คำปรึกษาเพื่อปิดงาน</div>
        <label>Purpose <small>(วัตถุประสงค์)</small></label>
        <div class="plain-options">
          ${PURPOSES.map(p => `
            <label><input type="radio" name="purpose-${task.id}" value="${p}" ${task.purpose === p ? "checked" : ""}
                          onchange="setPurpose('${task.id}', this.value)"> ${p}</label>`).join("")}
        </div>
        <label>Signature <small>(ลายเซ็นผู้ให้คำปรึกษา)</small></label>
        ${sigPickerHtml("advisor", stripTitle(ADVISORS[task.advisor].name))}
      </div>`;
  }

  const sendBar =
    task.status === "accepted" ? `
      <div style="text-align:center;margin-top:18px">
        <label class="check-line">
          <input type="checkbox" ${task.consultDone ? "checked" : ""} onchange="toggleConsultDone('${task.id}', this.checked)">
          The consultation has been completed
        </label>
      </div>
      <div class="bar" style="justify-content:center;margin-top:12px">
        <button class="primary" id="sendFormBtn" ${task.consultDone ? "" : "disabled"} onclick="sendForm('${task.id}')">Send form to requester</button>
      </div>`
    : task.status === "review" ? `
      <div class="error" id="closeError" style="text-align:center"></div>
      <div class="bar" style="justify-content:center"><button class="primary" onclick="completeByAdvisor('${task.id}')">Complete</button></div>`
    : "";

  return `
    <div class="card">
      <h2>${esc(task.topic)}</h2>
      <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>
    </div>
    ${actionPanel}
    <div class="card">
      <h2>AS-001 ${task.status === "done" ? "(completed)" : "(preview)"}</h2>
      ${consultDocHtml(task)}
      ${sendBar}
      ${downloadBar(task)}
    </div>`;
}

function setPurpose(id, value) {
  tasks.find(t => t.id === id).purpose = value;
  rerenderKeeping();
}

// อาจารย์กด "Send form to requester" (ไม่ต้องเซ็น) -> ส่งอีเมลให้ผู้ขอกรอก
// อาจารย์กด "Accept requirement" -> รับเรื่อง
function acceptTask(id) {
  const task = tasks.find(t => t.id === id);
  task.status = "accepted";
  openTaskId = id;
  sigs.advisor = newSig();
  render();
}

// ติ๊ก "The consultation has been completed" -> ปลดล็อกปุ่มส่งฟอร์ม
function toggleConsultDone(id, checked) {
  tasks.find(t => t.id === id).consultDone = checked;
  const btn = $("sendFormBtn");
  if (btn) btn.disabled = !checked;
}

async function sendForm(id) {
  const task = tasks.find(t => t.id === id);
  if (!task.consultDone) return;          // ต้องติ๊กยืนยันก่อนจึงจะส่งได้
  const advisor = ADVISORS[task.advisor];
  task.status = "sent";

  const results = await sendAll([[task.requester.email, `[Research Consultation] กรุณากรอกแบบฟอร์ม AS-001 (${task.id})`,
`เรียน ${task.requester.name}

อาจารย์ ${advisor.name} ให้คำปรึกษาเรื่อง "${task.topic}" เสร็จสิ้นแล้ว (Ref: ${task.id})

กรุณากรอกแบบฟอร์ม AS-001 (สรุปการให้คำปรึกษา วันที่ ระยะเวลา และลายเซ็น) แล้วกด Submit ที่ลิงก์นี้
${APP_URL()}#fill=${task.id}

Research Consultation Service`]]);

  notice = `ส่งแบบฟอร์ม ${esc(task.id)} ให้ผู้ขอแล้ว
            <button style="margin-left:8px" onclick="openFill('${id}')">เปิดหน้าผู้ขอ (demo)</button>
            ${mailResultHtml(results)}`;
  resetScroll = true;
  render();
}

// อาจารย์เซ็นเป็นคนสุดท้าย -> งานเสร็จสมบูรณ์ ส่งอีเมลถึงทั้งสองฝ่าย (popup QR ย้ายไปแสดงตอนผู้ขอกด Submit แล้ว)
async function completeByAdvisor(id) {
  const task = tasks.find(t => t.id === id);
  if (!task.purpose) {
    $("closeError").textContent = "กรุณาเลือกวัตถุประสงค์ (KPI standard / Working Hour/LU) ก่อนกด Complete";
    return;
  }
  if (!sigs.advisor.image) {
    $("closeError").textContent = "กรุณาลงลายเซ็นก่อนกด Complete (อัปโหลดไฟล์ หรือพิมพ์ชื่อแล้วเลือกลายเซ็น)";
    return;
  }
  task.advisorSig = sigs.advisor.image;
  task.status = "done";
  sigs.advisor = newSig();

  const advisor = ADVISORS[task.advisor];
  const body = who => `เรียน ${who}

บันทึกการให้คำปรึกษา (Ref: ${task.id}) เสร็จสมบูรณ์แล้ว

เรื่อง: ${task.topic}
ผู้ให้คำปรึกษา: ${advisor.name}
ผู้ขอรับคำปรึกษา: ${task.requester.name}
วันที่ให้คำปรึกษา: ${thaiDate(task.result.date)}
ระยะเวลา: ${task.result.hours} ชั่วโมง
วัตถุประสงค์: ${task.purpose}

สรุปการให้คำปรึกษา:
${task.result.summary}

Research Consultation Service`;

  const results = await sendAll([
    [advisor.email, `[Research Consultation] บันทึกการให้คำปรึกษาเสร็จสมบูรณ์ (${task.id})`, body(advisor.name)],
    [task.requester.email, `[Research Consultation] สำเนาบันทึกการให้คำปรึกษา (${task.id})`, body(task.requester.name)]
  ]);
  notice = `ปิดงาน ${esc(task.id)} เรียบร้อย ${mailResultHtml(results)}`;
  resetScroll = true;
  render();
}

function downloadBar(task) {
  if (task.status !== "done") return "";
  return `<div class="bar"><span class="small muted">ดาวน์โหลดเป็นไฟล์ PDF</span>
          <button class="primary" onclick="downloadPdf('${task.id}')">Download PDF</button></div>`;
}

/* =====================================================================
   8) SIGNATURE  (ใช้ร่วมกันทั้งอาจารย์และผู้ขอ: 1) อัปโหลดไฟล์  2) พิมพ์ชื่อแล้วสร้างลายเซ็น 3 แบบ)
   ===================================================================== */

function sigPickerHtml(who, defaultName) {
  const s = sigs[who];
  const up = s.mode === "upload";
  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button class="${up ? "primary" : ""}" onclick="setSigMode('${who}','upload')">1. Upload file</button>
      <button class="${up ? "" : "primary"}" onclick="setSigMode('${who}','type')">2. Type your name</button>
    </div>
    ${up
      ? `<input type="file" accept="image/png,image/jpeg" onchange="readSignature('${who}', this)">`
      : `<div class="two">
           <input id="sigName-${who}" placeholder="พิมพ์ชื่อของคุณ" value="${esc(s.typed || defaultName)}">
           <div class="sig-gen"><button onclick="generateSignatures('${who}')">Generate</button></div>
         </div>
         <div class="sig-tiles">${s.options.map((img, i) => `
           <div class="sig-tile ${s.image === img ? "selected" : ""}" onclick="pickSignature('${who}', ${i})"><img src="${img}"></div>`).join("")}</div>`}
    ${s.image && up ? `<img class="signature" src="${s.image}" style="background:#fff;padding:4px;margin-top:8px">` : ""}`;
}

// render ใหม่โดยไม่ให้ข้อความที่กรอกไว้หาย
const KEEP_IDS = ["summary", "date", "hours", "sigName-advisor", "sigName-requester"];
function rerenderKeeping() {
  const keep = KEEP_IDS.map(id => $(id) ? $(id).value : null);
  const scrollY = window.scrollY;
  render();
  KEEP_IDS.forEach((id, i) => { if (keep[i] !== null && $(id)) $(id).value = keep[i]; });
  const sc = $("sumCount"), sm = $("summary");        // อัปเดตตัวนับตัวอักษรหลังคืนค่า
  if (sc && sm) sc.textContent = sm.value.length;
  window.scrollTo(0, scrollY);
}

function setSigMode(who, mode) { sigs[who].mode = mode; sigs[who].image = null; rerenderKeeping(); }

function readSignature(who, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { sigs[who].image = reader.result; rerenderKeeping(); };
  reader.readAsDataURL(file);
}

// สร้างลายเซ็น 3 แบบจากชื่อที่พิมพ์ (วาดลง canvas เป็น PNG โปร่งใส) ตัวอักษรปกติ ไม่หนา ไม่เอียง
async function generateSignatures(who) {
  const s = sigs[who];
  const name = $("sigName-" + who).value.trim();
  if (!name) return;
  s.typed = name; s.image = null; s.options = [];

  for (const font of SIGN_FONTS) {
    try { await document.fonts.load(`normal 400 54px "${font}"`, name); } catch (e) { /* ไม่มีไฟล์ฟอนต์ -> ใช้ฟอนต์สำรอง */ }
    const canvas = document.createElement("canvas");
    canvas.width = 420; canvas.height =110;
    const g = canvas.getContext("2d");
    g.fillStyle = "#1b2a6b";
    g.font = `normal 400 54px "${font}", "Sriracha", sans-serif`;
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(name, 210, 60, 390);       // ไม่หมุน ไม่เอียง
    s.options.push(canvas.toDataURL("image/png"));
  }
  rerenderKeeping();
}
function pickSignature(who, i) { sigs[who].image = sigs[who].options[i]; rerenderKeeping(); }

${APP_URL()}

Research Consultation Service`]]);

  notice = `ส่งแบบฟอร์ม ${esc(task.id)} ให้อาจารย์ลงลายเซ็นแล้ว ${mailResultHtml(results)}`;
  render();                               // แสดงผลการส่งอีเมล (popup QR ยังคงอยู่จนกว่าจะกดปิด)

// ดาวน์โหลด PDF: ถ่ายภาพจากตัวอย่างบนจอ จึงหน้าตาตรงกับที่เห็นทุกประการ (A4 เต็ม ไม่ย่อตามจอมือถือ)
// (ระบบจริงควรสร้าง PDF ที่ server เพื่อให้เลือกข้อความได้)
async function downloadPdf(id) {
  const element = document.getElementById("doc-" + id);
  if (!element) { alert("ไม่พบเอกสาร"); return; }

  const btn = document.activeElement;
  const isBtn = btn && btn.tagName === "BUTTON";
  if (isBtn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = "Creating PDF…"; }

  // สำเนาเอกสารขนาด A4 จริง วางนอกจอ (ไม่โดนการย่อตามจอของ preview)
  const stage = document.createElement("div");
  stage.style.cssText = "position:fixed;left:-10000px;top:0;width:210mm;background:#fff;z-index:-1";
  const copy = element.cloneNode(true);
  copy.removeAttribute("id");
  Object.assign(copy.style, { transform: "none", margin: "0", width: "210mm" });   // คงค่า --vs ที่บีบไว้
  stage.appendChild(copy);
  document.body.appendChild(stage);
  tightenDoc(copy);                                          // ให้พอดี A4 หน้าเดียว
  Object.assign(copy.style, { border: "0", height: "297mm", minHeight: "0" });      // A4 เต็มแผ่น ไม่มีขอบ

  try {
    if (!window.htmlToImage || !window.jspdf) throw new Error("โหลดไลบรารีสร้าง PDF ไม่สำเร็จ (ตรวจอินเทอร์เน็ต)");
    await document.fonts.ready;
    await Promise.all([...copy.querySelectorAll("img")].map(img =>
      img.complete ? 1 : new Promise(r => { img.onload = img.onerror = r; })));

    // ให้ "เบราว์เซอร์เอง" เป็นคนวาดเอกสาร (เหมือน preview ทุกอย่าง: ฟอนต์ ตำแหน่ง เส้นจุด)
    const opts = { pixelRatio: 3, backgroundColor: "#ffffff", width: copy.offsetWidth, height: copy.offsetHeight };
    await htmlToImage.toCanvas(copy, opts);            // รอบแรก: อุ่นเครื่อง (โหลดฟอนต์/รูปเข้า cache ของเบราว์เซอร์)
    const canvas = await htmlToImage.toCanvas(copy, opts);
    const img = canvas.toDataURL("image/png");          // PNG: ตัวอักษรคมชัด ไม่มีรอยบีบอัดแบบ JPEG

    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", compress: true });
    pdf.addImage(img, "PNG", 0, 0, 210, 297, undefined, "FAST");   // เต็มหน้า A4 พอดี ไม่มีขอบซ้าย-ขวา
    pdf.save(`AS-001_${id}.pdf`);
  } catch (err) {
    console.error("PDF error:", err);
    const msg = err && err.message ? err.message : String(err);
    if (confirm("สร้างไฟล์ PDF อัตโนมัติไม่สำเร็จ\n(" + msg + ")\n\nกด OK เพื่อเปิดหน้าต่างพิมพ์ แล้วเลือกปลายทางเป็น 'Save as PDF' / 'บันทึกเป็น PDF'")) {
      await printDoc(id);
    }
  } finally {
    stage.remove();
    if (isBtn) { btn.disabled = false; btn.textContent = btn.dataset.t || "Download PDF"; }
    fitDocs();
  }
}

// วิธีสำรอง: เปิดหน้าต่างพิมพ์ของเบราว์เซอร์ แล้วเลือก "Save as PDF" (ข้อความคมชัด เลือกคัดลอกได้ ฟอนต์ตรง)
async function printDoc(id) {
  const element = document.getElementById("doc-" + id);
  if (!element) return;
  const css = [...document.querySelectorAll("style")].map(st => st.textContent).join("\n");
  const frame = document.createElement("iframe");
  frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(frame);
  const d = frame.contentDocument;
  d.open();
  d.write(`<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>AS-001_${id}</title><style>${css}
    @page { size: A4; margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; padding: 0; background: #fff; min-height: 0; display: block; overflow: hidden; }
    .doc { border: 0 !important; margin: 0 !important; transform: none !important; width: 210mm !important; height: 296mm !important; min-height: 0 !important; }
  </style></head><body>${element.outerHTML}</body></html>`);
  d.close();
  await new Promise(r => setTimeout(r, 300));
  try { await d.fonts.ready; } catch (e) { /* ignore */ }
  await Promise.all([...d.images].map(img => img.complete ? 1 : new Promise(r => { img.onload = img.onerror = r; })));
  const oldTitle = document.title;
  document.title = "AS-001_" + id;                 // ชื่อไฟล์ที่เบราว์เซอร์เสนอตอนบันทึกเป็น PDF
  const restore = () => { document.title = oldTitle; };
  frame.contentWindow.onafterprint = restore;
  frame.contentWindow.focus();
  frame.contentWindow.print();
  setTimeout(() => { restore(); frame.remove(); }, 60000);
}

(function openFromHash() {
  const m = location.hash.match(/^#fill=(RC-\d+)$/);
