<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Research &amp; Innovation Consultation Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Sarabun:wght@400;500;600;700&family=Sriracha&display=swap" rel="stylesheet">

  <style>
    /* =====================================================================
       ฟอนต์ที่ไม่มีใน Google Fonts
       วางไฟล์ฟอนต์ไว้ในโฟลเดอร์ "fonts" ข้างไฟล์ HTML นี้ (หรือติดตั้งฟอนต์ในเครื่อง)
         fonts/THSarabunNew.ttf
         fonts/THSarabunNew-Bold.ttf
         fonts/Kart-Satapat.ttf
         fonts/TorsilpYaLuemChan.ttf
       ===================================================================== */
    @font-face { font-family: "TH Sarabun New"; font-weight: 400;
      src: local("TH Sarabun New"), local("THSarabunNew"), url("fonts/THSarabunNew.ttf") format("truetype"); }
    @font-face { font-family: "TH Sarabun New"; font-weight: 700;
      src: local("TH Sarabun New Bold"), local("THSarabunNew-Bold"), local("THSarabunNew Bold"), url("fonts/THSarabunNew-Bold.ttf") format("truetype"); }
    @font-face { font-family: "Kart-Satapat";
      src: local("Kart-Satapat"), local("Kart Satapat"), local("KartSatapat"), url("fonts/Kart-Satapat.ttf") format("truetype"); }
    @font-face { font-family: "Torsilp YaLuemChan";
      src: local("Torsilp YaLuemChan"), local("TorsilpYaLuemChan"), local("Torsilp-YaLuemChan"), url("fonts/TorsilpYaLuemChan.ttf") format("truetype"); }

    /* ===== Theme: เปลี่ยนสีหลักได้ที่นี่ที่เดียว ===== */
    :root {
      --bg: #f7f7f7;        /* พื้นหลังเว็บ */
      --card: #ffffff;
      --ink: #14213d;       /* สีตัวอักษรหลัก */
      --muted: #5b6b85;     /* ตัวอักษรรอง */
      --line: #dbe3ef;      /* เส้นขอบ */
      --primary: #46538c;   /* สีปุ่ม / สีเน้น */
      --primary-soft: #e9ebf4;
      --next: #d92d20;      /* สีแดง: ปุ่มที่ต้องกดเป็นลำดับถัดไป */
      --ok: #16794c;
      --bad: #b42318;
      --page: 1200px;       /* ความกว้างสูงสุดของเนื้อหา (main) */

      /* ระยะซ้าย-ขวาของ header (โลโก้/ชื่อบริการ) และ nav (เมนู) ปรับที่เดียวตรงนี้
         20px = ระยะต่ำสุดตอนจอแคบ | 1320px = ความกว้างกรอบ
         จอใหญ่กว่า 1320px: เนื้อหาจะอยู่กึ่งกลางเสมอ (ไม่จำกัดระยะสูงสุดต่อข้างแล้ว) */
      --nav-pad: clamp(20px, calc((100vw - 1320px) / 2), 300px);

      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    html { scroll-padding-top: env(safe-area-inset-top, 0px);
      -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* กันมือถือขยายตัวอักษรเอง (ทำให้เอกสารเพี้ยน) */
    html { touch-action: manipulation; }   /* กัน double-tap zoom ทั้งหน้า (ยัง pinch ได้) */
    * { box-sizing: border-box; }

    /* ฟอนต์: อังกฤษ = Arial, ไทย = Noto Sans Thai */
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 Arial, 'Noto Sans Thai', sans-serif;
    }

    /* ===== Header / Navigation ===== */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px var(--nav-pad);       /* ระยะซ้าย-ขวา ใช้ --nav-pad */
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    .brand { margin-left: auto; text-align: right; font-weight: 700; color: var(--primary); }  /* ชื่อบริการอยู่ขวา */
    .logo { order: -1; height: 50px; width: auto; cursor: pointer; }                          /* โลโก้อยู่ซ้าย กดกลับหน้า Home */

    /* โครงหน้า: เมนูซ้าย (แนวตั้ง) + เนื้อหาขวา */
    body { display: flex; flex-direction: column; min-height: 100vh; }
    /* 3 คอลัมน์: [เมนูซ้าย] [เนื้อหาหลัก กว้างสูงสุด --page] [ที่ว่างขวา]
       - จอ iMac และเล็กกว่า: เนื้อหาหลักขยายเต็มพื้นที่ที่เหลือ เหมือนเดิมทุกประการ
       - จอที่ใหญ่กว่า: เมนูอยู่ซ้ายที่เดิม ส่วนเนื้อหาหลักอยู่กึ่งกลางหน้าจอ */
    .layout {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(248px, 1fr) minmax(0, var(--page)) minmax(0, 1fr);
      align-items: start;
      padding: 24px var(--nav-pad) 40px;     /* ระยะซ้าย-ขวาใช้ --nav-pad เหมือน header */
    }

    /* เมนูซ้าย: เรียงลงล่างเป็นแถว (ไม่ใช่ปุ่ม) */
    nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: none;
      width: 220px;
      grid-column: 1;
      position: sticky;
      top: 16px;
      padding: 0;
      margin: 0;
      border-left: 1px solid var(--line);
    }
    nav button {
      width: 100%;
      text-align: left;
      display: flex; align-items: center; gap: 10px;     /* ไอคอน + ข้อความ */
      padding: 10px 16px;
      border: 0;
      border-left: 3px solid transparent;
      border-radius: 0 8px 8px 0;
      background: none;
      color: var(--ink);
      margin-left: -1px;
    }
    nav .nav-ico { width: 18px; height: 18px; flex: none; }   /* สีตาม currentColor = สีตัวอักษรเมนู */
    nav button:hover { background: var(--primary-soft); }
    nav button.active {
      background: var(--primary-soft);
      color: var(--primary);
      border-left-color: var(--primary);
      font-weight: 700;
    }

    /* ===== Notification badge (วงกลมแดง) ===== */
    .badge {
      margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px;
      display: inline-grid; place-items: center;
      border-radius: 99px; background: #d92d20; color: #fff;
      font-size: 11px; font-weight: 700; line-height: 1;
    }
    .badge[hidden] { display: none; }
    #burger .badge { position: absolute; top: -6px; right: -6px; margin: 0; }

    /* แท็บเลือกกลุ่มงาน (In progress / Completed) */
    .seg { display: flex; gap: 8px; margin: 4px 0 16px; }
    .seg button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 14px; font-weight: 700; }
    .seg button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
    .seg .badge { margin: 0; }
    .seg small { font-weight: 400; opacity: .85; }
    /* รายละเอียดงานที่กางออกใต้แถบรายการ */
    .task-detail { margin: -6px 0 20px; padding-left: 14px; border-left: 3px solid var(--primary); }

    /* ปุ่มที่กดไปแล้ว = สีจาง */
    button.seen { opacity: .5; }

    main { grid-column: 2; min-width: 0; margin: 0; padding: 0; }

    /* ===== Footer (ทุกหน้า) ===== */
    footer {
      padding: 18px var(--nav-pad);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      background: var(--card);
      border-top: 1px solid var(--line);
    }

    /* ===== Basic elements ===== */
    h1 { font-size: 30px; line-height: 1.25; margin: 0 13 0px; }
    h2 { font-size: 20px; margin: 0 0 4px; }
    h3 { font-size: 16px; margin: 0 0 6px; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }

    button {
      font: inherit;
      cursor: pointer;
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--ink);
    }
    button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    /* ปุ่มที่ต้องกดเป็นลำดับถัดไป (Next / Submit / Accept / Send / Complete) = สีแดง */
    button.next { background: var(--next); border-color: var(--next); color: #fff; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    input, select, textarea {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
    }
    input[type=checkbox], input[type=radio] { width: auto; }
    textarea { min-height: 90px; }
    input, select { height: 44px; }                       /* ช่องกรอกและ dropdown สูงเท่ากัน */
    input[type=checkbox], input[type=radio], input[type=file] { height: auto; }

    label { display: block; margin: 12px 0 4px; font-weight: 500; }
    label small { font-weight: 400; color: var(--muted); }

    /* ตัวเลือกแบบเรียบ ๆ (KPI / Working Hour) พื้นหลังขาว ไม่มีกรอบสี */
    .plain-options { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 4px 0; }
    .plain-options label {
      display: inline-flex; gap: 8px; align-items: center;
      margin: 0; font-weight: 400; cursor: pointer; background: none;
    }
    .plain-options input { margin: 0; accent-color: var(--primary); }

    /* ===== Cards & layout ===== */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }
    .hero { position: relative; overflow: hidden; padding: 36px 28px; background: linear-gradient(135deg, #e9ebf4, #fff); }
    .hero > *:not(.hero-art) { position: relative; z-index: 1; }
    .hero-art {                               /* ภาพเวกเตอร์เอกสาร สีจาง ๆ ไม่เด่น */
      position: absolute; z-index: 0; pointer-events: none;
      right: 36px; top: 50%; transform: translateY(-50%) rotate(6deg);
      width: 190px; height: auto; color: var(--primary); opacity: .1;
    }
    .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); }
    .two  { display: grid; gap: 0 14px; grid-template-columns: 1fr 1fr; }
    .info-box { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--card); }
    .bar { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; }
    .error { color: var(--bad); margin-top: 8px; }

    /* ===== Home: timeline "How it works" ===== */
    .timeline .item { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
    .timeline .item::before {            /* เส้นเชื่อมระหว่างข้อ */
      content: '';
      position: absolute; left: 15px; top: 34px; bottom: 2px;
      width: 2px; background: var(--line);
    }
    .timeline .item:last-child::before { display: none; }
    .timeline .num {
      flex: none; width: 32px; height: 32px;
      display: grid; place-items: center;
      border-radius: 50%; background: var(--primary); color: #fff; font-weight: 700;
    }

    /* ===== แถบแสดงความคืบหน้าของงาน (ทั้งฝั่งผู้ขอและอาจารย์) ===== */
    .process { padding: 16px 18px; }
    .process .p-title { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; font-size: 13px; color: var(--muted); }
    .process .p-title b { color: var(--primary); }
    .process .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .process .st .line { height: 4px; border-radius: 4px; background: var(--line); margin-bottom: 8px; }
    .process .st .name { font-size: 12px; line-height: 1.3; color: var(--muted); }
    .process .st .name small { display: block; font-size: 11px; opacity: .85; }
    .process .st.passed .line { background: var(--ok); }
    .process .st.passed .name { color: var(--ok); }
    .process .st.current .line { background: var(--primary); }
    .process .st.current .name { color: var(--primary); font-weight: 700; }
    .process.compact { padding: 0; margin: 8px 0 0; border: 0; background: none; border-radius: 0; }
    .process.compact .steps { gap: 4px; max-width: 260px; }
    .process.compact .st .line { margin: 0; height: 5px; }

    /* ===== Hamburger (มือถือ) ===== */
    #burger { display: none; flex: none; position: relative; width: 44px; height: 44px; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    #burger span { position: absolute; left: 11px; right: 11px; height: 2px; border-radius: 2px; background: var(--primary); transition: transform .25s, opacity .2s, top .25s; }
    #burger span:nth-child(1) { top: 14px; }
    #burger span:nth-child(2) { top: 21px; }
    #burger span:nth-child(3) { top: 28px; }
    body.menu-open #burger span:nth-child(1) { top: 21px; transform: rotate(45deg); }
    body.menu-open #burger span:nth-child(2) { opacity: 0; }
    body.menu-open #burger span:nth-child(3) { top: 21px; transform: rotate(-45deg); }
    #menu-backdrop { display: none; }
    @keyframes menuDrop { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    /* ===== Wizard: stepper (3 ขั้นตอน) ===== */
    .stepper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .stepper .num  { font-size: 22px; font-weight: 700; color: var(--muted); }
    .stepper .name { font-size: 13px; margin-bottom: 8px; color: var(--muted); }
    .stepper .line { height: 4px; border-radius: 4px; background: var(--line); }
    .stepper .current .num, .stepper .current .name { color: var(--primary); }
    .stepper .current .line { background: var(--primary); }
    .stepper .passed .num, .stepper .passed .name { color: var(--ok); }
    .stepper .passed .line { background: var(--ok); }

    /* ===== Wizard: choices, chips, advisors ===== */
    .chip {
      display: inline-flex; gap: 6px; align-items: center;
      margin: 3px 4px 3px 0; padding: 3px 10px;
      border-radius: 99px; font-size: 13px;
      background: var(--primary-soft); color: var(--primary);
      max-width: 100%; overflow-wrap: anywhere;
    }
    .chip a { cursor: pointer; }

    .advisor {
      display: flex; gap: 12px; align-items: flex-start; cursor: pointer;
      padding: 12px; margin-bottom: 8px;
      border: 1.5px solid var(--line); border-radius: 12px;
    }
    .advisor > div { min-width: 0; overflow-wrap: anywhere; }
    .advisor.selected { border-color: var(--primary); background: var(--primary-soft); }
    .advisor-list {
      max-height: 420px; overflow: auto; padding: 14px;
      border: 1px solid #d9d9d9; border-radius: 12px;          /* กรอบเส้นบาง สีเทา */
    }
    .advisor-list .advisor:last-child { margin-bottom: 0; }
    .avatar { flex: none; width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); background: var(--primary-soft); }
    .advisor .pick { flex: none; margin: 4px 0 0 auto; accent-color: var(--primary); }

    .tag {
      display: inline-block; margin-right: 4px; padding: 1px 8px;
      border: 1px solid ; border-radius: 6px;
      font-size: 12px; color: var(--muted); white-space: nowrap;
    }
    .tag.match { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }   /* ป้าย match = ปุ่มเขียว ตัวอักษรขาว */
    .dropzone { padding: 16px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; }

    /* ===== Review table / task status ===== */
    table { width: 100%; border-collapse: collapse; }
    td { padding: 7px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
    td:first-child { width: 36%; color: var(--muted); }
    .status { padding: 2px 10px; border-radius: 99px; font-size: 12px; }
    .status.new  { background: #fef3c7; color: #92400e; }
    .status.done { background: #dcfce7; color: #166534; }

    /* ===== หน้างานอาจารย์ / popup ===== */
    .task-card { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; cursor: pointer; }
    .status.sent { background: #e0e7ff; color: #3730a3; }
    .status.review { background: #fce7f3; color: #9d174d; }
    .status.accepted { background: #cffafe; color: #155e75; }
    .check-line { display: inline-flex; gap: 8px; align-items: center; margin: 0; font-weight: 400; cursor: pointer; }
    .check-line input { margin: 0; accent-color: var(--primary); width: 18px; height: 18px; }
    .notice { background: var(--primary-soft); border: 1px solid var(--primary); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; overflow-wrap: anywhere; }
    .notice ul { margin: 6px 0 0; padding-left: 20px; }
    .mail-ok  { color: var(--ok); }
    .mail-bad { color: var(--bad); }
    /* กรอบเซ็นชื่อ */
    .sig-pad-wrap { position: relative; background: #fff; border: 2px dashed var(--line); border-radius: 12px; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .sig-pad-wrap::before { content: ""; position: absolute; left: 6%; right: 6%; bottom: 28%; border-bottom: 1px dotted #aab3c5; pointer-events: none; }
    .sig-pad { display: block; width: 100%; height: auto; aspect-ratio: 3 / 1; touch-action: none; cursor: crosshair; }
    .sig-hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 13px; color: #aab3c5; pointer-events: none; }
    .sig-pad-wrap.has .sig-hint { display: none; }
    .sig-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .modal { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(20, 33, 61, .55); }
    .modal-box { max-width: 360px; padding: 24px; text-align: center; background: #fff; border-radius: 16px; }
    .modal-box img { width: 200px; height: 200px; }
    .signature { display: block; max-height: 100px; }

    /* ===== เอกสาร AS-001: A4 (210 x 297 mm) ใช้ TH Sarabun New ทั้งฉบับ ===== */
    .doc-wrap { overflow: hidden; padding: 12px; border-radius: 8px; background: #e5e5e5; }   /* ย่อให้พอดีจอด้วย fitDocs() */
    .doc {
      width: 210mm; min-height: 297mm; margin: 0 auto; padding: calc(14mm * var(--vs, 1)) 18mm;
      display: flex; flex-direction: column;
      background: #fff; color: #111; border: 1px solid #bbb;
      font-family: 'TH Sarabun New', 'Sarabun', sans-serif;
      font-size: 22px; line-height: 1.3;
    }
    .doc-head { display: flex; justify-content: space-between; font-size: 20px; padding-bottom: 6px; border-bottom: 2px solid #1f6f9f; }
    .doc h3 { margin: calc(36px * var(--vs, 1)) 0 calc(14px * var(--vs, 1)); text-align: center; font-size: 20px; font-weight: 700; }
    .doc h4 { margin: calc(18px * var(--vs, 1)) 0 4px; font-size: 20px; font-weight: 700; }
    .doc .row { display: flex; gap: 8px; align-items: flex-end; margin: calc(7px * var(--vs, 1)) 0; white-space: nowrap; }
    .doc .spread { gap: 18px; align-items: center; }
    .doc .spread > span { white-space: nowrap; }
    .doc .bullet { display: inline-block; width: 6px; height: 6px; margin-right: 8px; border-radius: 50%; background: #111; vertical-align: middle; }

    /* กล่องติ๊กถูก: วาดด้วย CSS ล้วน (ไม่ใช้รูป/ฟอนต์ เพื่อให้สร้าง PDF ได้) */
    .doc .cb {
      position: relative;
      display: inline-block; width: 20px; height: 20px; vertical-align: -6px; margin-right: 4px;
      border: 2px solid #111; border-radius: 3px;
    }
    .doc .cb.on::after {                       /* เครื่องหมายถูก */
      content: ""; position: absolute; left: 4px; top: -1px;
      width: 5px; height: 11px;
      border: solid #111; border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    /* ช่องกรอก = ข้อความอยู่เหนือเส้นจุดไข่ปลา (เส้นจุดวาดด้วย gradient ไม่ใช้รูป) */
    .doc .v { flex: 1; min-height: 26px; padding: 0 6px 2px; white-space: normal; }
    .dots-row {
      background: radial-gradient(circle at 1.5px 4.5px, #111 .9px, transparent 1.2px) left bottom / 6px 6px repeat-x;
    }
    .doc .summary {      /* ข้อมูลโดยสรุป: เส้นจุดไข่ปลาทุกบรรทัด ข้อความตัดขึ้นบรรทัดใหม่ตามเส้นจุด */
      min-height: calc(160px * var(--vs, 1)); line-height: 32px;

/* =====================================================================
   0) EMAIL CONFIG  (การส่งอีเมลจริง)
   ---------------------------------------------------------------------
   หน้าเว็บนี้ส่งอีเมลผ่านบริการ EmailJS (https://www.emailjs.com)
   วิธีตั้งค่า:
     1. สมัคร EmailJS แล้วเชื่อมบัญชีอีเมลผู้ส่ง (Email Services) -> ได้ serviceId
     2. สร้าง Email Template ที่มีตัวแปร  {{to_email}}  {{subject}}  {{message}}
        - ช่อง "To email" ใส่ {{to_email}}
        - ช่อง "Subject" ใส่ {{subject}}
        - เนื้อหา ใส่ <div style="white-space:pre-wrap">{{message}}</div>
        -> ได้ templateId
     3. ที่ Account -> API keys คัดลอก Public Key
   ระหว่างทดสอบ ใส่อีเมลตัวเองใน testRecipient เพื่อไม่ให้อีเมลหลุดไปถึงอาจารย์จริง
   ===================================================================== */
const EMAIL_CONFIG = {
  serviceId: "",
  templateId: "",
  publicKey: "",
  testRecipient: "",      // ถ้าใส่ ทุกอีเมลจะถูกส่งมาที่ที่อยู่นี้แทน (ใช้ตอนทดสอบ) ตอนใช้งานจริงให้ว่างไว้
  fromName: "Research & Innovation Consultation Service"
};

async function sendEmail(to, subject, message) {
  const c = EMAIL_CONFIG;
  if (!c.serviceId || !c.templateId || !c.publicKey) {
    return { ok: false, to, error: "ยังไม่ได้ตั้งค่า EMAIL_CONFIG (ดูคำอธิบายที่ส่วนบนของสคริปต์)" };
  }
  const target = c.testRecipient || to;
  try {
    const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: c.serviceId,
        template_id: c.templateId,
        user_id: c.publicKey,
        template_params: { to_email: target, subject, message, from_name: c.fromName, original_to: to }
      })
    });
    if (!res.ok) throw new Error((await res.text()) || res.status);
    return { ok: true, to: target };
  } catch (err) {
    return { ok: false, to, error: err.message };
  }
}

// ส่งหลายฉบับพร้อมกัน jobs = [[to, subject, message], ...]
const sendAll = jobs => Promise.all(jobs.map(([to, subject, message]) => sendEmail(to, subject, message)));

// สรุปผลการส่งเป็น HTML

    : `<li class="mail-bad">✗ ส่งถึง ${esc(r.to)} ไม่สำเร็จ: ${esc(r.error)}</li>`).join("")}</ul>`;

function makeAvatar(name) {

  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><rect width="64" height="64" fill="#e9ebf4"/><text x="32" y="41" font-size="22" text-anchor="middle" fill="#46538c" font-family="Arial">${initials}</text></svg>`;

// ป้องกัน HTML injection เวลาแสดงข้อความที่ผู้ใช้พิมพ์
function esc(text) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
  return String(text ?? "").replace(/[&<>"]/g, c => map[c]);
}

// เอกสาร AS-001 ต้องพอดี A4 หน้าเดียว: ถ้าเนื้อหายาวเกิน ค่อย ๆ บีบระยะห่างแนวตั้ง (--vs) จนพอดี
function tightenDoc(doc) {
  const limit = 297 * 96 / 25.4;                 // ความสูง A4 เป็นพิกเซล
  let vs = 1;
  doc.style.setProperty("--vs", vs);
  while (doc.offsetHeight > limit + 1 && vs > 0.3) {
    vs = Math.round((vs - 0.05) * 100) / 100;
    doc.style.setProperty("--vs", vs);
  }
}

// ย่อเอกสาร AS-001 ให้พอดีความกว้างหน้าจอ (มือถือ) ไม่ย่อถ้าจอกว้างพอ
function fitDocs() {
  document.querySelectorAll(".doc-wrap").forEach(wrap => {
    const doc = wrap.querySelector(".doc");
    if (!doc) return;
    doc.style.transform = "";                    // วัดความสูงจริงก่อนย่อตามจอ
    tightenDoc(doc);
    const cs = getComputedStyle(wrap);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const scale = Math.min(1, (wrap.clientWidth - padX) / doc.offsetWidth);
    if (scale < 1) {
      doc.style.transformOrigin = "top left";
      doc.style.transform = `scale(${scale})`;
      doc.style.marginLeft = "0";
      wrap.style.height = (doc.offsetHeight * scale + padY) + "px";
    } else {
      doc.style.transform = "";
      doc.style.marginLeft = "";
      wrap.style.height = "";
    }
  });
}
window.addEventListener("resize", fitDocs);
if (document.fonts) document.fonts.ready.then(fitDocs);

const escRegex = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

// คีย์เวิร์ดสั้น (<=3 ตัวอักษร เช่น ai, tb) ต้องตรงทั้งคำ ไม่งั้นจะไปตรงกลางคำอื่นมั่ว
function hasTerm(haystack, term) {
  return term.length <= 3
    ? new RegExp("(^|[^a-z0-9])" + escRegex(term) + "($|[^a-z0-9])").test(haystack)
    : haystack.includes(term);
}

// ให้คะแนนอาจารย์ตามคีย์เวิร์ดที่ผู้ใช้ใส่ (ตรงทั้งวลี +2, ตรงรายคำ +1)
function scoreAdvisor(advisor) {
  let score = 0;
  state.keywords.forEach(keyword => {
    const k = keyword.toLowerCase().trim();
    if (k.length < 2) return;
    [k, ALIASES[k]].filter(Boolean).forEach(term => {
      if (hasTerm(advisor.haystack, term)) score += 2;
    });
    k.split(/\s+/).forEach(word => {
      if (word.length > 3 && advisor.haystack.includes(word)) score += 1;
    });
  });
  return score;
}

// กรอง (ตามสาขา / ชื่อ) แล้วเรียงตามคะแนนคีย์เวิร์ด
function findAdvisors() {
  const q = state.search.toLowerCase().trim();
  return ADVISORS
    .map((advisor, index) => ({ advisor, index, score: scoreAdvisor(advisor) }))
    .filter(({ advisor }) =>
      (state.fieldFilter === "" || advisor.fields.includes(Number(state.fieldFilter))) &&
      (!q || advisor.name.toLowerCase().includes(q)))
    .sort((a, b) => b.score - a.score || a.index - b.index);
}

function advisorListHtml(matches) {
  if (!matches.length) return `<div class="muted">No advisor found</div>`;

  return matches.map(({ advisor, index, score }) => {
    const on = state.selectedAdvisors.includes(index);
    return `
      <div class="advisor ${on ? "selected" : ""}" onclick="pickAdvisor(${index})">
        <img class="avatar" src="${advisor.photo}" alt=""
             onerror="this.onerror=null;this.src=ADVISORS[${index}].avatar">
        <div>
          <b>${esc(advisor.name)}</b> ${score ? '<span class="tag match">match</span>' : ""}
          <div class="small muted">${advisor.dept}</div>
          <div style="margin:3px 0">${advisor.fields.map(i => `<span class="tag">${FIELDS[i]}</span>`).join("")}</div>
          <div class="small muted">${esc(advisor.research)}</div>
        </div>
        <input type="radio" class="pick" ${on ? "checked" : ""} tabindex="-1">
      </div>`;
  }).join("");
}

function onKeyword(value) {
  state.kwText = value;

  refreshAdvisorList();
}

function onSearch(value) {

  state.selectedAdvisors = state.selectedAdvisors[0] === index ? [] : [index];

  const list = document.querySelector(".advisor-list");
  const scrollTop = list.scrollTop;     // คงตำแหน่งที่เลื่อนอยู่

function addFiles(input) {
  state.error = "";
  Array.from(input.files).forEach(file => {
    if (!/\.(pdf|jpe?g)$/i.test(file.name)) state.error = "รองรับเฉพาะ PDF และ JPEG";
    else if (file.size > 10 * 1024 * 1024) state.error = "ไฟล์ใหญ่เกิน 10 MB";
    else state.files.push(file.name);   // ของจริง: อัปโหลดไฟล์ไปเก็บที่ server
  });
  render();
}

/* ---------- ปุ่ม Next / Back + ตรวจความถูกต้อง ---------- */
function changeStep(direction) {
  state.error = "";
  const f = state.form;

  if (direction > 0) {
    if (state.step === 1) {
      const emailOk = /\S+@\S+\.\S+/.test(f.email);
      if (!(f.name && f.position && f.affiliation && emailOk && f.tel)) {
        state.error = "กรุณากรอกข้อมูลให้ครบ และตรวจสอบอีเมล";
        return render();
      }
    }
    if (state.step === 2 && (!state.topic.trim() || !state.selectedAdvisors.length)) {
      state.error = "กรุณากรอกชื่อเรื่องและเลือกอาจารย์ 1 ท่าน";
      return render();
    }
  }
  state.step += direction;
  resetScroll = true;
  render();
}

    jobs.push([advisor.email, `[Research & Innovation Consultation] คำขอรับคำปรึกษาใหม่ ${id}: ${state.topic}`,
`เรียน ${advisor.name}

มีผู้ขอรับคำปรึกษาถึงท่าน (Ref: ${id})

หน่วยงาน: ${f.affiliation}

เรื่อง: ${state.topic}
รายละเอียด: ${state.details || "-"}
คีย์เวิร์ด: ${state.keywords.join(", ") || "-"}
ไฟล์แนบ: ${state.files.join(", ") || "-"}

กรุณาติดต่อผู้ขอเพื่อนัดหมายวันให้คำปรึกษา และเปิดหน้า Advisor Tasks เพื่อดูรายละเอียด
${APP_URL()}

Research & Innovation Consultation Service`]);
  });

  // อีเมลยืนยันถึงผู้ขอ
  jobs.push([f.email, `[Research & Innovation Consultation] ได้รับคำขอของคุณแล้ว (${ids.join(", ")})`,
`เรียน ${f.name}

ระบบได้ส่งคำขอรับคำปรึกษาเรื่อง "${state.topic}" ถึงอาจารย์ดังนี้แล้ว

เลขอ้างอิง: ${ids.join(", ")}

/* =====================================================================
   7) ADVISOR TASKS  (อาจารย์: รับงาน -> ให้คำปรึกษา -> กรอกฟอร์ม+เซ็น -> ส่งให้ผู้ขอ -> [ผู้ขอเห็นชอบ/แก้ไข+เซ็น] -> อาจารย์ View/ดาวน์โหลด PDF)
   ===================================================================== */

const STATUS_LABEL = { new: "New", accepted: "In consultation", sent: "Waiting for requester", done: "Completed" };

function renderTasks() {
  const myTasks = tasks.filter(t => t.advisor === currentAdvisor);
  let html = takeNotice();

  html += `
    <div class="card">
      <h2>Advisor Tasks</h2>
      <label>Signed in as <small>(demo — ของจริงใช้ PSU login)</small></label>
      <select onchange="currentAdvisor = Number(this.value); openTaskId = null; sigs.advisor = newSig(); render()">
        ${ADVISORS.map((a, i) => `<option value="${i}" ${i === currentAdvisor ? "selected" : ""}>${esc(a.name)}</option>`).join("")}
      </select>
    </div>`;

  const active = myTasks.filter(t => t.status !== "done");
  const finished = myTasks.filter(t => t.status === "done").sort((a, b) => b.completed - a.completed);
  const unseenDone = finished.filter(t => !t.expired && !(t.seen && t.seen.done)).length;

  // แจ้งเตือน: ผู้ขอลงนามเสร็จแล้ว แต่อาจารย์ยังไม่ได้เปิดดู
  if (unseenDone) html += `<div class="notice">🔔 มี ${unseenDone} งานที่ผู้ขอลงนามเสร็จสมบูรณ์แล้ว — ไปที่แท็บ Completed แล้วกด View เพื่อดูไฟล์ PDF</div>`;

  // แท็บ 2 กลุ่ม: งานที่ยังไม่เสร็จ / งานที่เสร็จแล้ว
  html += `
    <div class="seg">
      <button class="${taskTab === "active" ? "on" : ""}" onclick="setTaskTab('active')">
        In progress <small>ยังไม่เสร็จ (${active.length})</small>
      </button>
      <button class="${taskTab === "finished" ? "on" : ""}" onclick="setTaskTab('finished')">
        Completed <small>เสร็จแล้ว (${finished.length})</small>
        ${unseenDone ? `<span class="badge">${unseenDone}</span>` : ""}
      </button>
    </div>`;

  const list = taskTab === "active" ? active : finished;
  if (!list.length) {
    return html + `<div class="card muted">${taskTab === "active" ? "ไม่มีงานค้าง" : "ยังไม่มีงานที่เสร็จสมบูรณ์"}</div>`;
  }
  // รายละเอียดพับไว้ กดดูแล้วกางออกใต้แถบรายการนั้น
  return html + list.map(t => taskCardHtml(t) + (openTaskId === t.id ? `<div class="task-detail">${renderTaskDetail(t)}</div>` : "")).join("");
}

function setTaskTab(tab) {
  syncDraft();
  taskTab = tab;
  openTaskId = null;
  render();
}

function taskCardHtml(t) {
  const done = t.status === "done";
  const canView = !done || pdfAvailable(t);
  const isOpen = openTaskId === t.id;
  const seenKey = t.status === "new" || done;           // ปุ่มจางลงเมื่อเคยเปิดดูแล้ว (งานใหม่/งานเสร็จ)
  const btn = canView
    ? `<button class="primary ${seenKey && t.seen && t.seen[t.status] && !isOpen ? "seen" : ""}">${isOpen ? "Hide" : "View"}</button>` : "";
  const meta = done
    ? ` · เสร็จเมื่อ ${thaiDate(isoDate(t.completed))} · ${pdfAvailable(t) ? "ไฟล์ PDF เหลือ " + pdfDaysLeft(t) + " วัน" : "ไฟล์ PDF หมดอายุแล้ว (เหลือเฉพาะรายการ)"}`
    : "";
  return `
    <div class="card task-card" style="${isOpen ? "border-color:var(--primary)" : ""}"
         onclick="openTask('${t.id}')">
      <div style="flex:1;min-width:220px">
        <span class="status ${t.status}">${STATUS_LABEL[t.status]}</span> <b>${esc(t.topic)}</b>
        <div class="small muted">${t.id} · ${esc(t.requester.name)}${meta}</div>
        ${processHtml(t, true)}
      </div>
      ${btn}
    </div>`;
}

// กดแถบรายการ: กางรายละเอียด / กดซ้ำ: พับเก็บ
function openTask(id) {
  syncDraft();                                   // เก็บข้อความที่กรอกค้างไว้ของงานเดิมก่อน
  if (openTaskId === id) { openTaskId = null; render(); return; }
  sigs.advisor = newSig();
  const t = tasks.find(x => x.id === id);
  if (t) {
    t.seen = t.seen || {}; t.seen[t.status] = true;   // จำว่าเปิดดูแล้ว
    if (pdfAvailable(t)) pdfWarnId = id;              // งานที่เสร็จแล้ว: เตือนให้ดาวน์โหลด PDF
  }
  openTaskId = id;
  render();
}

    actionPanel = `

        <h2>Complete your consultation form</h2>
        <div class="muted small">รับเรื่องแล้ว เมื่อให้คำปรึกษาเสร็จ ให้กรอกสรุป วันที่ ระยะเวลา เลือกวัตถุประสงค์ และลงลายเซ็นผู้ให้คำปรึกษา แล้วกดส่งแบบฟอร์มให้ผู้ขอตรวจสอบ</div>
        <div class="bar" style="justify-content:flex-start;margin-top:10px"><button class="primary seen" disabled>✓ Accepted</button></div>

        <label>Summary <small>ข้อมูลโดยสรุปของการให้คำปรึกษา (ไม่เกิน ${SUMMARY_MAX} ตัวอักษร)</small></label>
        <textarea id="summary" maxlength="${SUMMARY_MAX}"

        <div class="small muted" style="text-align:right"><span id="sumCount">${(d.summary || "").length}</span> / ${SUMMARY_MAX}</div>

        <div class="two">
          <div><label>Date <small>วันที่ให้คำปรึกษา</small></label><input type="date" id="date" value="${d.date || isoDate(Date.now())}" onchange="syncDraft()"></div>
          <div><label>Duration (hours) <small>ระยะเวลาที่ให้คำปรึกษา</small></label><input type="number" id="hours" step="0.5" min="0.5" value="${d.hours || 1}" onchange="syncDraft()"></div>
        </div>

        <label>Purpose <small>(วัตถุประสงค์)</small></label>
        <div class="plain-options">
          ${PURPOSES.map(p => `
            <label><input type="radio" name="purpose-${task.id}" value="${p}" ${task.purpose === p ? "checked" : ""}
                          onchange="setPurpose('${task.id}', this.value)"> ${p}</label>`).join("")}
        </div>

        <label>Signature <small>(ลายเซ็นผู้ให้คำปรึกษา)</small></label>
        ${sigPickerHtml("advisor", stripTitle(ADVISORS[task.advisor].name))}
      </div>`;
  } else if (task.status === "sent") {
    actionPanel = `
      <div class="card">
        <h2>Waiting for requester</h2>
        <div class="muted small">ส่งแบบฟอร์มให้ผู้ขอแล้ว รอผู้ขอตรวจสอบ เลือกเห็นชอบ/แก้ไข และลงนาม ระบบจะแจ้งเตือนคุณเมื่อเสร็จสมบูรณ์</div>
      </div>`;
  } else if (task.status === "done" && task.requesterReview) {
    const rv = task.requesterReview;
    actionPanel = `
      <div class="card">
        <h2>Requester response</h2>
        <div>${rv.approved ? "✓ ผู้ขอเห็นชอบกับแบบฟอร์ม" : "✎ ผู้ขอขอแก้ไข: " + esc(rv.note)}</div>
      </div>`;
  }

  const sendBar = task.status === "accepted" ? `
      <div class="error" id="closeError" style="text-align:center"></div>
      <div class="bar" style="justify-content:center"><button class="next" id="sendFormBtn" onclick="sendForm('${task.id}')">Send form to requester</button></div>`
    : "";

  const docCard = task.expired
    ? `<div class="card">
         <h2>AS-001</h2>
         <div class="muted">ไฟล์ PDF ถูกลบแล้ว (เก็บไว้ ${PDF_RETENTION_DAYS} วัน) — รายการให้คำปรึกษานี้ยังคงอยู่ในประวัติ</div>
       </div>`
    : `<div class="card">
         <h2>AS-001 ${task.status === "done" ? "(completed)" : "(preview)"}</h2>
         ${consultDocHtml(task)}
         ${sendBar}
         ${downloadBar(task)}
       </div>`;

  return `
    ${processHtml(task)}
    <div class="card">
      <h2>${esc(task.topic)}</h2>
      <table>${rows.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join("")}</table>
    </div>
    ${actionPanel}
    ${docCard}`;
}

function setPurpose(id, value) {
  tasks.find(t => t.id === id).purpose = value;
  rerenderKeeping();
}

// เก็บข้อความที่อาจารย์กรอกในฟอร์ม (สรุป/วันที่/ชั่วโมง) ไว้ใน task.draft เพื่อแสดงในตัวอย่างเอกสาร
function syncDraft() {
  const t = tasks.find(x => x.id === openTaskId);
  if (state.view === "tasks" && t && t.status === "accepted" && $("summary") && $("date") && $("hours")) {
    t.draft = { summary: $("summary").value.slice(0, SUMMARY_MAX), date: $("date").value, hours: $("hours").value };
  }
}

// อาจารย์กด "Accept requirement" -> รับเรื่อง
function acceptTask(id) {
  const task = tasks.find(t => t.id === id);
  task.status = "accepted";
  openTaskId = id;
  sigs.advisor = newSig();
  render();
}

// อาจารย์กด "Send form to requester": ตรวจข้อมูล -> ส่งให้ผู้ขอตรวจสอบและลงนาม
async function sendForm(id) {
  const task = tasks.find(t => t.id === id);
  const err = $("closeError");
  const summary = $("summary").value.trim().slice(0, SUMMARY_MAX);
  if (!summary || !Number($("hours").value)) { err.textContent = "กรุณากรอกสรุปและระยะเวลาก่อนส่ง"; return; }
  if (!task.purpose) { err.textContent = "กรุณาเลือกวัตถุประสงค์ (KPI standard / Working Hour/LU)"; return; }
  if (!sigs.advisor.image) { err.textContent = "กรุณาลงลายเซ็นก่อนส่ง (เซ็นในกรอบ หรืออัปโหลดไฟล์)"; return; }

  $("sendFormBtn").disabled = true;
  task.result = { summary, date: $("date").value, hours: $("hours").value };
  task.advisorSig = sigs.advisor.image;
  task.draft = null;
  task.status = "sent";
  sigs.advisor = newSig();
  const advisor = ADVISORS[task.advisor];

  const results = await sendAll([[task.requester.email, `[Research & Innovation Consultation] กรุณาตรวจสอบและลงนามแบบฟอร์ม AS-001 (${task.id})`,
`เรียน ${task.requester.name}

อาจารย์ ${advisor.name} ให้คำปรึกษาเรื่อง "${task.topic}" เสร็จสิ้นแล้ว และกรอกแบบฟอร์ม AS-001 เรียบร้อย (Ref: ${task.id})

กรุณาตรวจสอบแบบฟอร์ม เลือกว่าเห็นชอบหรือแก้ไข (โปรดระบุ) ลงลายเซ็น แล้วกด Complete ที่ลิงก์นี้
${APP_URL()}#fill=${task.id}

Research & Innovation Consultation Service`]]);

  notice = `ส่งแบบฟอร์ม ${esc(task.id)} ให้ผู้ขอแล้ว
            <button style="margin-left:8px" onclick="openFill('${id}')">เปิดหน้าผู้ขอ (demo)</button>
            ${mailResultHtml(results)}`;
  resetScroll = true;
  render();
}

function downloadBar(task) {
  if (!pdfAvailable(task)) return "";
  return `<div class="bar"><span class="small muted">ดาวน์โหลดเป็นไฟล์ PDF · เก็บไว้อีก ${pdfDaysLeft(task)} วัน</span>
          <button class="primary" onclick="downloadPdf('${task.id}')">Download PDF</button></div>`;
}

// popup เตือนเมื่ออาจารย์เปิดงานที่เสร็จแล้ว: ไฟล์เก็บ 90 วัน
function pdfWarnHtml() {
  return `
    <div class="modal" onclick="closePdfWarn()">
      <div class="modal-box" onclick="event.stopPropagation()">
        <div style="font-size:40px">⚠️</div>
        <h3>กรุณาดาวน์โหลดเก็บแบบฟอร์มไว้</h3>
        <p class="muted small">เนื่องจากไฟล์ดังกล่าวจะเก็บไว้เป็นระยะเวลา ${PDF_RETENTION_DAYS} วันเท่านั้น<br>
           หลังจากนั้นไฟล์จะถูกลบ แต่รายการที่เคยให้คำปรึกษาจะยังอยู่</p>
        <div class="bar" style="justify-content:center">

/* =====================================================================
   8) SIGNATURE  (ใช้ร่วมกันทั้งอาจารย์และผู้ขอ: 1) เซ็นลงในกรอบ  2) อัปโหลดไฟล์)
   เก็บลายเซ็นเป็น "รายเส้น" เพื่อทำ Undo / Redo / Clear ได้
   ===================================================================== */

function sigPickerHtml(who) {
  const s = sigs[who];
  const draw = s.mode === "draw";
  return `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <button class="${draw ? "primary" : ""}" onclick="setSigMode('${who}','draw')">1. Draw signature</button>
      <button class="${draw ? "" : "primary"}" onclick="setSigMode('${who}','upload')">2. Upload file</button>
    </div>
    ${draw
      ? `<div class="sig-pad-wrap ${s.image ? "has" : ""}">
           <canvas class="sig-pad" data-who="${who}" width="900" height="300"></canvas>
           <div class="sig-hint">เซ็นชื่อในกรอบนี้ (ใช้นิ้วหรือเมาส์)</div>
         </div>
         <div class="sig-tools">
           <button id="sig-undo-${who}" onclick="undoSig('${who}')" ${s.idx > 0 ? "" : "disabled"}>↩ Undo</button>
           <button id="sig-redo-${who}" onclick="redoSig('${who}')" ${s.idx < s.hist.length - 1 ? "" : "disabled"}>↪ Redo</button>
           <button id="sig-clear-${who}" onclick="clearSig('${who}')" ${sigStrokes(s).length ? "" : "disabled"}>Clear</button>
         </div>`
      : `<input type="file" accept="image/png,image/jpeg" onchange="readSignature('${who}', this)">`}
    ${s.image && !draw ? `<img class="signature" src="${s.image}" style="background:#fff;padding:4px;margin-top:8px">` : ""}`;
}

// วาดเส้นทั้งหมดลง canvas (พิกัดเก็บเป็นพิกัดของ canvas จึงวาดซ้ำได้ตรงเสมอ)
function drawStrokes(cv, strokes) {
  const g = cv.getContext("2d");
  g.clearRect(0, 0, cv.width, cv.height);
  g.lineWidth = 5; g.lineCap = "round"; g.lineJoin = "round";
  g.strokeStyle = g.fillStyle = "#1b2a6b";
  strokes.forEach(pts => {
    if (pts.length === 1) { g.beginPath(); g.arc(pts[0][0], pts[0][1], 2.5, 0, Math.PI * 2); g.fill(); return; }
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
    g.stroke();
  });
}

function getSigCanvas(who) { return document.querySelector(`canvas.sig-pad[data-who="${who}"]`); }

// อัปเดตสถานะปุ่ม Undo / Redo / Clear โดยไม่ render ทั้งหน้า
function updateSigTools(who) {
  const s = sigs[who];
  const set = (id, off) => { const b = $(id + "-" + who); if (b) b.disabled = off; };
  set("sig-undo", s.idx <= 0);
  set("sig-redo", s.idx >= s.hist.length - 1);
  set("sig-clear", !sigStrokes(s).length);
}

// อัปเดตเฉพาะพรีวิวเอกสาร AS-001 (ไม่ render ทั้งหน้า ไม่กระตุก ไม่ทำให้กรอบเซ็นถูกสร้างใหม่)
function refreshDocPreview(who) {
  const id = who === "advisor" ? openTaskId : fillTaskId;
  const task = id && tasks.find(t => t.id === id);
  const el = id && document.getElementById("doc-" + id);
  if (!task || !el) return;
  syncDraft();
  const wrap = el.closest(".doc-wrap");
  if (wrap) { wrap.outerHTML = consultDocHtml(task); fitDocs(); }
}

// เรียกทุกครั้งที่ลายเซ็นเปลี่ยน (ยกมือ / undo / redo / clear)
function commitSig(who) {
  const s = sigs[who], cv = getSigCanvas(who);
  if (!cv) return;
  s.image = sigStrokes(s).length ? cropSig(cv) : null;
  cv.parentElement.classList.toggle("has", !!s.image);
  updateSigTools(who);
  refreshDocPreview(who);
}

function applySig(who) {
  const cv = getSigCanvas(who);
  if (!cv) return;
  drawStrokes(cv, sigStrokes(sigs[who]));
  commitSig(who);
}
function undoSig(who)  { const s = sigs[who]; if (s.idx > 0) { s.idx--; applySig(who); } }
function redoSig(who)  { const s = sigs[who]; if (s.idx < s.hist.length - 1) { s.idx++; applySig(who); } }
function clearSig(who) { const s = sigs[who]; if (sigStrokes(s).length) { pushSig(s, []); applySig(who); } }   // Clear ก็ Undo ได้

// กรอบเซ็นชื่อ: เขียนต่อเนื่องได้หลายเส้น ยกมือแล้วเขียนต่อได้ทันที (ไม่ render ทั้งหน้าระหว่างเซ็น)
function initSigPads() {
  document.querySelectorAll("canvas.sig-pad").forEach(cv => {
    const who = cv.dataset.who, g = cv.getContext("2d");
    drawStrokes(cv, sigStrokes(sigs[who]));        // วาดเส้นเดิมกลับ (หลัง render ใหม่)

    let cur = null, activeId = null;
    const pos = e => {
      const r = cv.getBoundingClientRect();
      return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
    };
    // กัน iOS/Android ซูมหรือเลื่อนหน้าตอนแตะในกรอบ
    cv.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
    cv.addEventListener("touchmove",  e => e.preventDefault(), { passive: false });

    cv.addEventListener("pointerdown", e => {
      if (cur) return;                               // สนใจนิ้วแรกนิ้วเดียว
      e.preventDefault();
      activeId = e.pointerId; cv.setPointerCapture(e.pointerId);
      const p = pos(e); cur = [p];
      g.lineWidth = 5; g.lineCap = "round"; g.lineJoin = "round"; g.strokeStyle = g.fillStyle = "#1b2a6b";
      g.beginPath(); g.arc(p[0], p[1], 2.5, 0, Math.PI * 2); g.fill();
      cv.parentElement.classList.add("has");         // ซ่อนข้อความ hint ทันที
    });
    cv.addEventListener("pointermove", e => {
      if (!cur || e.pointerId !== activeId) return;
      e.preventDefault();
      const p = pos(e), last = cur[cur.length - 1];
      cur.push(p);
      g.beginPath(); g.moveTo(last[0], last[1]); g.lineTo(p[0], p[1]); g.stroke();
    });
    const end = e => {
      if (!cur || e.pointerId !== activeId) return;
      const s = sigs[who];
      pushSig(s, [...sigStrokes(s), cur]);
      cur = null; activeId = null;
      commitSig(who);                                // อัปเดตเฉพาะพรีวิว ไม่ render ทั้งหน้า
    };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
  });
}

// ตัดขอบว่างรอบลายเซ็นออก ให้ลายเซ็นเต็มช่องในเอกสาร
function cropSig(cv) {
  const w = cv.width, h = cv.height, d = cv.getContext("2d").getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[(y * w + x) * 4 + 3] > 10) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  }
  if (x1 < 0) return null;
  const pad = 8;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(h - 1, y1 + pad);
  const out = document.createElement("canvas");
  out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext("2d").drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out.toDataURL("image/png");
}

// render ใหม่โดยไม่ให้ข้อความที่กรอกไว้หาย
const KEEP_IDS = ["summary", "date", "hours"];
function rerenderKeeping() {
  syncDraft();
  const keep = KEEP_IDS.map(id => $(id) ? $(id).value : null);
  const scrollY = window.scrollY;
  render();
  KEEP_IDS.forEach((id, i) => { if (keep[i] !== null && $(id)) $(id).value = keep[i]; });
  const sc = $("sumCount"), sm = $("summary");        // อัปเดตตัวนับตัวอักษรหลังคืนค่า
  if (sc && sm) sc.textContent = sm.value.length;
  window.scrollTo(0, scrollY);
}

function setSigMode(who, mode) { sigs[who] = { ...newSig(), mode }; rerenderKeeping(); }

function readSignature(who, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { sigs[who].image = reader.result; rerenderKeeping(); };
  reader.readAsDataURL(file);
}


/* =====================================================================
   9) REQUESTER FORM  (ผู้ขอคำปรึกษา: ตรวจแบบฟอร์ม -> เลือกเห็นชอบ/แก้ไข -> เซ็นชื่อ -> Complete)
   ===================================================================== */

function openFill(id) {
  fillTaskId = id;
  const t = tasks.find(x => x.id === id);
  if (t) { t.seen = t.seen || {}; t.seen[t.status] = true; }
  sigs.requester = newSig();
  reviewDraft = { choice: null, note: "" };
  showView("fill");
}

function setReview(choice) { reviewDraft.choice = choice; rerenderKeeping(); }

function renderFill() {
  const t = fillTaskId && tasks.find(x => x.id === fillTaskId);
  return (t ? processHtml(t) : "") + takeNotice() + renderFillBody();   // แถบความคืบหน้าอยู่บนสุด
}

function renderFillBody() {
  // ยังไม่ได้เลือกฟอร์ม: แสดงรายการที่รอกรอก (demo — ของจริงเปิดจากลิงก์ในอีเมล)
  if (!fillTaskId) {
    const waiting = tasks.filter(t => t.status === "sent");
    return `
      <div class="card">
        <h2>Requester Form</h2>
        <div class="muted small">หน้านี้คือหน้าที่ผู้ขอรับคำปรึกษาเปิดจากลิงก์ในอีเมล (ตัวอย่างแสดงรายการที่อาจารย์ส่งมา)</div>
      </div>
      ${waiting.map(t => `
        <div class="card task-card" onclick="openFill('${t.id}')">
          <div><b>${esc(t.topic)}</b>
            <div class="small muted">${t.id} · ผู้ให้คำปรึกษา ${esc(ADVISORS[t.advisor].name)} · ผู้ขอ ${esc(t.requester.name)}</div></div>
          <button class="next ${t.seen && t.seen.sent ? "seen" : ""}">Open form</button>
        </div>`).join("") || `<div class="card muted">ยังไม่มีแบบฟอร์มที่รอตรวจสอบ — ให้อาจารย์กด "Send form to requester" ที่หน้า Advisor Tasks ก่อน</div>`}`;
  }

  const task = tasks.find(t => t.id === fillTaskId);
  if (!task) { fillTaskId = null; return renderFillBody(); }

  // อาจารย์ยังไม่ได้ส่งแบบฟอร์ม
  if (task.status === "new" || task.status === "accepted") {
    return `<div class="card muted">อาจารย์ยังไม่ได้ส่งแบบฟอร์มของงานนี้ ยังไม่สามารถตรวจสอบได้</div>`;
  }

  // เสร็จแล้ว: ฝั่งผู้ขอไม่แสดงรายการอีก (สำเนาถูกส่งทางอีเมลแล้ว)
  if (task.status === "done") {
    return `<div class="card muted">งานนี้เสร็จสมบูรณ์แล้ว ระบบได้ส่งสำเนาทางอีเมลให้คุณแล้ว</div>`;
  }

  // status = sent: ผู้ขอตรวจสอบ เลือกเห็นชอบ/แก้ไข ลงนาม แล้วกด Complete
  const rv = reviewDraft;
  return `
    <div class="card">
      <h2>Review the consultation form</h2>
      <div class="muted small" style="margin-bottom:12px">${esc(task.topic)} · ผู้ให้คำปรึกษา ${esc(ADVISORS[task.advisor].name)} กรอกแบบฟอร์มและลงลายเซ็นแล้ว กรุณาตรวจสอบ</div>
      ${consultDocHtml(task)}
    </div>
    <div class="card">
      <h2>Confirm and sign</h2>
      <div class="plain-options" style="flex-direction:column;gap:10px;margin-top:8px">
        <label><input type="radio" name="review" value="approve" ${rv.choice === "approve" ? "checked" : ""}
                      onchange="setReview('approve')"> เห็นชอบกับแบบฟอร์ม</label>
        <label><input type="radio" name="review" value="edit" ${rv.choice === "edit" ? "checked" : ""}
                      onchange="setReview('edit')"> แก้ไข โปรดระบุ :</label>
      </div>
      ${rv.choice === "edit"
        ? `<input id="reviewNote" placeholder="ระบุสิ่งที่ต้องการแก้ไข" value="${esc(rv.note)}"
                  oninput="reviewDraft.note = this.value" style="margin-top:6px">` : ""}

      <label>Signature <small>ลายเซ็นผู้ขอรับคำปรึกษา</small></label>
      ${sigPickerHtml("requester", task.requester.name)}

      <div class="error" id="fillError" style="text-align:center"></div>
      <div class="bar" style="justify-content:center"><button class="next" id="completeBtn" onclick="submitFill('${task.id}')">Complete</button></div>
    </div>`;
}

// ผู้ขอกด Complete: บันทึกคำตอบ + ลายเซ็น -> งานเสร็จสมบูรณ์ -> แจ้งอาจารย์ (ให้กด View เพื่อดู PDF)
// และเด้ง popup QR แบบประเมินความพึงพอใจให้ผู้ขอรับคำปรึกษา
async function submitFill(id) {
  const task = tasks.find(t => t.id === id);
  const rv = reviewDraft;
  const err = $("fillError");
  if (!rv.choice) { err.textContent = "กรุณาเลือกว่าเห็นชอบกับแบบฟอร์ม หรือต้องการแก้ไข"; return; }
  if (rv.choice === "edit" && !rv.note.trim()) { err.textContent = "กรุณาระบุสิ่งที่ต้องการแก้ไข"; return; }
  if (!sigs.requester.image) { err.textContent = "กรุณาลงลายเซ็นก่อนกด Complete"; return; }

  $("completeBtn").disabled = true;
  task.requesterReview = { approved: rv.choice === "approve", note: rv.choice === "edit" ? rv.note.trim() : "" };
  task.requesterSig = sigs.requester.image;
  task.status = "done";
  task.completed = Date.now();
  fillTaskId = null;                           // รายการหายจากหน้าผู้ขอทันที
  sigs.requester = newSig();
  reviewDraft = { choice: null, note: "" };
  if (openTaskId === id) openTaskId = null;   // ฝั่งอาจารย์เห็นเป็นแค่แถบรายการ จนกว่าจะกด View
  if (pdfWarnId === id) pdfWarnId = null;

  // เด้ง QR ทันที (ไม่ต้องรออีเมลส่งเสร็จ)
  showQr = true;
  resetScroll = true;
  render();

  const advisor = ADVISORS[task.advisor];
  const response = task.requesterReview.approved ? "เห็นชอบกับแบบฟอร์ม" : "ขอแก้ไข: " + task.requesterReview.note;
  const body = who => `เรียน ${who}

บันทึกการให้คำปรึกษา (Ref: ${task.id}) เสร็จสมบูรณ์แล้ว ผู้ขอลงนามเรียบร้อย

เรื่อง: ${task.topic}
ผู้ให้คำปรึกษา: ${advisor.name}
ผู้ขอรับคำปรึกษา: ${task.requester.name}
วันที่ให้คำปรึกษา: ${thaiDate(task.result.date)}
ระยะเวลา: ${task.result.hours} ชั่วโมง
วัตถุประสงค์: ${task.purpose}
คำตอบของผู้ขอ: ${response}

สรุปการให้คำปรึกษา:
${task.result.summary}

กรุณาเปิดหน้า Advisor Tasks กด View เพื่อดูและดาวน์โหลดไฟล์ PDF เก็บไว้ (ไฟล์เก็บ ${PDF_RETENTION_DAYS} วัน)
${APP_URL()}

Research & Innovation Consultation Service`;

  const results = await sendAll([
    [advisor.email, `[Research & Innovation Consultation] ผู้ขอลงนามแล้ว งานเสร็จสมบูรณ์ (${task.id})`, body(advisor.name)],
    [task.requester.email, `[Research & Innovation Consultation] สำเนาบันทึกการให้คำปรึกษา (${task.id})`, body(task.requester.name)]
  ]);

  notice = `ลงนามและปิดงาน ${esc(task.id)} เรียบร้อย ${mailResultHtml(results)}`;
  render();                               // แสดงผลการส่งอีเมล (popup QR ยังคงอยู่จนกว่าจะกดปิด)
}

// ดาวน์โหลด PDF: ถ่ายภาพจากตัวอย่างบนจอ จึงหน้าตาตรงกับที่เห็นทุกประการ (A4 เต็ม ไม่ย่อตามจอมือถือ)
// (ระบบจริงควรสร้าง PDF ที่ server เพื่อให้เลือกข้อความได้)
async function downloadPdf(id) {
  const element = document.getElementById("doc-" + id);
  if (!element) { alert("ไม่พบเอกสาร"); return; }

  const btn = document.activeElement;
  const isBtn = btn && btn.tagName === "BUTTON";
  if (isBtn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = "Creating PDF…"; }

  // สำเนาเอกสารขนาด A4 จริง วางนอกจอ (ไม่โดนการย่อตามจอของ preview)
  const stage = document.createElement("div");
  stage.style.cssText = "position:fixed;left:-10000px;top:0;width:210mm;background:#fff;z-index:-1";
  const copy = element.cloneNode(true);
  copy.removeAttribute("id");
  Object.assign(copy.style, { transform: "none", margin: "0", width: "210mm" });   // คงค่า --vs ที่บีบไว้
  stage.appendChild(copy);
  document.body.appendChild(stage);
  tightenDoc(copy);                                          // ให้พอดี A4 หน้าเดียว
  Object.assign(copy.style, { border: "0", height: "297mm", minHeight: "0" });      // A4 เต็มแผ่น ไม่มีขอบ

  try {
    if (!window.htmlToImage || !window.jspdf) throw new Error("โหลดไลบรารีสร้าง PDF ไม่สำเร็จ (ตรวจอินเทอร์เน็ต)");
    await document.fonts.ready;
    await Promise.all([...copy.querySelectorAll("img")].map(img =>
      img.complete ? 1 : new Promise(r => { img.onload = img.onerror = r; })));

    // ให้ "เบราว์เซอร์เอง" เป็นคนวาดเอกสาร (เหมือน preview ทุกอย่าง: ฟอนต์ ตำแหน่ง เส้นจุด)
    const opts = { pixelRatio: 3, backgroundColor: "#ffffff", width: copy.offsetWidth, height: copy.offsetHeight };
    await htmlToImage.toCanvas(copy, opts);            // รอบแรก: อุ่นเครื่อง (โหลดฟอนต์/รูปเข้า cache ของเบราว์เซอร์)
    const canvas = await htmlToImage.toCanvas(copy, opts);
    const img = canvas.toDataURL("image/png");          // PNG: ตัวอักษรคมชัด ไม่มีรอยบีบอัดแบบ JPEG

    const pdf = new window.jspdf.jsPDF({ unit: "mm", format: "a4", compress: true });
    pdf.addImage(img, "PNG", 0, 0, 210, 297, undefined, "FAST");   // เต็มหน้า A4 พอดี ไม่มีขอบซ้าย-ขวา
    pdf.save(`AS-001_${id}.pdf`);
  } catch (err) {
    console.error("PDF error:", err);
    const msg = err && err.message ? err.message : String(err);
    if (confirm("สร้างไฟล์ PDF อัตโนมัติไม่สำเร็จ\n(" + msg + ")\n\nกด OK เพื่อเปิดหน้าต่างพิมพ์ แล้วเลือกปลายทางเป็น 'Save as PDF' / 'บันทึกเป็น PDF'")) {
      await printDoc(id);
    }
  } finally {
    stage.remove();
    if (isBtn) { btn.disabled = false; btn.textContent = btn.dataset.t || "Download PDF"; }
    fitDocs();
  }
}

// วิธีสำรอง: เปิดหน้าต่างพิมพ์ของเบราว์เซอร์ แล้วเลือก "Save as PDF" (ข้อความคมชัด เลือกคัดลอกได้ ฟอนต์ตรง)
async function printDoc(id) {
  const element = document.getElementById("doc-" + id);
  if (!element) return;
  const css = [...document.querySelectorAll("style")].map(st => st.textContent).join("\n");
  const frame = document.createElement("iframe");
  frame.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
  document.body.appendChild(frame);
  const d = frame.contentDocument;
  d.open();
  d.write(`<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><title>AS-001_${id}</title><style>${css}
    @page { size: A4; margin: 0; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    html, body { margin: 0; padding: 0; background: #fff; min-height: 0; display: block; overflow: hidden; }
    .doc { border: 0 !important; margin: 0 !important; transform: none !important; width: 210mm !important; height: 296mm !important; min-height: 0 !important; }
  </style></head><body>${element.outerHTML}</body></html>`);
  d.close();
  await new Promise(r => setTimeout(r, 300));
  try { await d.fonts.ready; } catch (e) { /* ignore */ }
  await Promise.all([...d.images].map(img => img.complete ? 1 : new Promise(r => { img.onload = img.onerror = r; })));
  const oldTitle = document.title;
  document.title = "AS-001_" + id;                 // ชื่อไฟล์ที่เบราว์เซอร์เสนอตอนบันทึกเป็น PDF
  const restore = () => { document.title = oldTitle; };
  frame.contentWindow.onafterprint = restore;
  frame.contentWindow.focus();
  frame.contentWindow.print();
  setTimeout(() => { restore(); frame.remove(); }, 60000);
}
